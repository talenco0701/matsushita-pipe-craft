<style>
  :root {
    --panel: rgba(13, 22, 40, .82);
    --line: rgba(120, 150, 200, .28);
    --sky: #38bdf8;
    --amber: #fbbf24;
    --rose: #fb7185;
    --green: #4ade80;
    --text: #f1f5fb;
    --muted: #9fb0c9;
    --outline: 0 2px 0 #0f172a, 2px 0 0 #0f172a, -2px 0 0 #0f172a, 0 -2px 0 #0f172a, 2px 2px 0 #0f172a, -2px 2px 0 #0f172a, 2px -2px 0 #0f172a, -2px -2px 0 #0f172a, 0 5px 10px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(180deg, #6ec6ff 0%, #bfe7ff 55%, #e6f6ff 100%);
    color: var(--text);
    font-family: 'M PLUS Rounded 1c', system-ui, sans-serif;
    font-weight: 800;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  button { font: inherit; }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #app {
    position: relative;
    z-index: 2;
    max-width: 460px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    padding: calc(8px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
  }
  #app > * { pointer-events: auto; }
  #app > #boardWrap { pointer-events: none; }

  /* ---------- HUD ---------- */
  .hud {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 5px 6px 5px 8px;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  .hud-stage { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .tag {
    flex-shrink: 0;
    background: var(--sky);
    color: #04121f;
    font-weight: 900;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    letter-spacing: .04em;
  }
  #stageName { font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn {
    flex-shrink: 0;
    width: 32px; height: 32px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.08);
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
  }

  .costbar {
    position: relative;
    height: 24px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  #costFill {
    position: absolute; inset: 0 auto 0 0;
    width: 0;
    background: linear-gradient(90deg, #16a34a, #4ade80);
    transition: width .2s, background .3s;
  }
  .costbar.over-est #costFill { background: linear-gradient(90deg, #d97706, #fbbf24); }
  .costbar.over-budget #costFill { background: linear-gradient(90deg, #e11d48, #fb7185); }
  #estMark { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; opacity: .8; }
  #costText {
    position: relative;
    display: block;
    text-align: center;
    font-size: 12px;
    line-height: 22px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.85);
  }
  .chips { display: flex; gap: 6px; justify-content: center; font-size: 11px; color: var(--muted); }
  .chips span { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }
  .chips b { color: var(--text); }
  .chips .good b { color: var(--green); }
  .chips .bad b { color: var(--rose); }

  #boardWrap { flex: 1 1 0; min-height: 0; }

  /* ---------- 部材パレット ---------- */
  .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .part {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    padding: 5px 2px 4px;
    border-radius: 12px;
    border: 2px solid var(--line);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    transition: transform .08s;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  .part:active { transform: scale(.95); }
  .part canvas { width: 34px; height: 34px; border-radius: 7px; }
  .part span { font-size: 10.5px; font-weight: 900; line-height: 1.2; }
  .part b { font-size: 11px; color: var(--amber); line-height: 1.1; }
  .part.on { border-color: var(--amber); background: rgba(60, 40, 8, .9); box-shadow: 0 0 14px rgba(251,191,36,.55); }
  .part:disabled { opacity: .5; }

  .controls { display: flex; gap: 8px; }

  /* ---------- ボタン ---------- */
  .btn {
    border: 0;
    border-radius: 16px;
    padding: 13px 16px;
    font-weight: 900;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,.35);
    transition: transform .08s cubic-bezier(.34,1.56,.64,1), box-shadow .08s;
  }
  .btn:active:not(:disabled) { transform: translateY(4px) scale(.97); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn-primary { background: linear-gradient(90deg, #38bdf8, #22d3ee); color: #04121f; }
  .btn-amber { background: linear-gradient(90deg, #fbbf24, #f97316); color: #1c0d00; }
  .btn-ghost { background: var(--panel); color: #e2e8f0; border: 1px solid var(--line); }
  .btn-x { background: #000; color: #fff; border: 1px solid #333; }
  .btn-line { background: #06c755; color: #fff; }
  .grow { flex: 1; }
  .btn.small { padding: 13px 14px; }

  /* ---------- 演出レイヤー ---------- */
  #fx { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .pop {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: 17px;
    font-weight: 900;
    color: #fff;
    white-space: nowrap;
    text-shadow: var(--outline);
    animation: popUp 1.05s ease-out forwards;
  }
  .pop.good { color: #86efac; }
  .pop.bad { color: #fda4af; font-size: 15px; }
  .pop.gold { color: #fde047; }
  .pop.cyan { color: #a5f3fc; }
  .pop.big { font-size: 26px; }
  @keyframes popUp {
    0% { transform: translate(-50%, -30%) scale(.4); opacity: 0; }
    16% { transform: translate(-50%, -70%) scale(1.3); opacity: 1; }
    28% { transform: translate(-50%, -80%) scale(1); }
    75% { opacity: 1; }
    100% { transform: translate(-50%, -190%) scale(1); opacity: 0; }
  }
  .banner {
    position: absolute;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 44px;
    font-weight: 900;
    white-space: nowrap;
    color: #fff;
    letter-spacing: .02em;
    text-shadow: 0 4px 0 #0f172a, 4px 0 0 #0f172a, -4px 0 0 #0f172a, 0 -4px 0 #0f172a, 3px 3px 0 #0f172a, -3px 3px 0 #0f172a, 3px -3px 0 #0f172a, -3px -3px 0 #0f172a, 0 10px 20px rgba(0,0,0,.35);
    animation: bannerIn 1.6s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .banner.blue { color: #7dd3fc; }
  .banner.small { font-size: 30px; }
  .banner.red { color: #fb7185; }
  .banner.rainbow {
    font-size: 58px;
    background: linear-gradient(90deg, #ff4d6d, #ffb84d, #fff35c, #5cff8d, #4dc9ff, #b04dff, #ff4d6d);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: none;
    -webkit-text-stroke: 2px #fff;
    filter: drop-shadow(0 5px 0 #1e1b4b) drop-shadow(0 0 22px rgba(255,255,255,.9));
    animation: bannerIn 2.4s cubic-bezier(.34,1.56,.64,1) forwards, rainbow .9s linear infinite;
  }
  .banner small { display: block; font-size: 15px; text-align: center; letter-spacing: .1em; }
  @keyframes bannerIn {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
    14% { transform: translate(-50%, -50%) scale(1.25) rotate(3deg); opacity: 1; }
    24% { transform: translate(-50%, -50%) scale(1) rotate(0); }
    80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.35); opacity: 0; }
  }
  @keyframes rainbow { to { background-position: 200% 0; } }
  .combo {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    padding: 4px 14px;
    border-radius: 999px;
    background: rgba(8, 47, 73, .85);
    border: 2px solid #22d3ee;
    color: #a5f3fc;
    font-size: 18px;
    font-weight: 900;
    box-shadow: 0 0 18px rgba(34,211,238,.6);
    opacity: 0;
    transition: opacity .2s;
  }
  .combo.show { opacity: 1; }
  .combo.bump { animation: bump .25s ease-out; }
  @keyframes bump { 40% { transform: translateX(-50%) scale(1.3); } }

  /* ---------- オーバーレイ ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(4, 12, 28, .55);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }
  .overlay.show { display: flex; }
  .card {
    width: 100%;
    max-width: 400px;
    max-height: 100%;
    overflow-y: auto;
    background: linear-gradient(180deg, rgba(22,34,58,.97), rgba(15,24,43,.97));
    border: 2px solid #2b4067;
    border-radius: 24px;
    padding: 20px 18px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
    animation: pop .32s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card h2 { margin: 6px 0 4px; font-size: 22px; font-weight: 900; }
  .card p { margin: 6px 0; font-size: 13px; line-height: 1.6; color: #cdd8ea; font-weight: 700; }
  .card .btn { width: 100%; margin-top: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row2 .btn { margin-top: 10px; }

  .brand { font-size: 12px; color: var(--sky); letter-spacing: .2em; }
  .logo { margin: 6px 0 2px; font-size: 40px; line-height: 1.05; font-weight: 900; letter-spacing: -.01em; }
  .logo span { display: block; font-size: 26px; color: var(--amber); }
  .logo em { font-style: normal; background: linear-gradient(180deg, #fff 30%, #7dd3fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { font-size: 14px !important; color: #e2e8f0 !important; }
  .howto {
    text-align: left;
    margin: 12px 0 4px;
    padding: 10px 12px 10px 30px;
    background: #0b1324;
    border: 1px solid var(--line);
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.7;
    font-weight: 700;
    color: #cbd5e1;
  }
  .howto b { color: #fff; }
  .prices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .prices div { background: #0b1324; border: 1px solid var(--line); border-radius: 10px; padding: 6px 2px; font-size: 11px; }
  .prices b { display: block; color: var(--amber); font-size: 14px; }
  .best { margin-top: 10px; font-size: 12px; color: var(--muted); }

  .missions { list-style: none; margin: 12px 0 0; padding: 0; text-align: left; display: grid; gap: 6px; }
  .missions li {
    background: #0b1324;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 800;
    display: flex; gap: 8px; align-items: center;
  }
  .missions li .st { color: #475569; font-size: 16px; }
  .missions li.ok .st { color: var(--amber); }
  .missions li.ng { color: #7c8aa3; }
  .money { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  .money div { background: #0b1324; border: 1px solid var(--line); border-radius: 12px; padding: 8px; font-size: 11px; color: var(--muted); }
  .money b { display: block; font-size: 20px; color: var(--text); }

  .stars { font-size: 44px; letter-spacing: .08em; line-height: 1; margin: 6px 0; }
  .stars span { display: inline-block; animation: starIn .45s cubic-bezier(.34,1.56,.64,1) both; }
  .stars .on { color: var(--amber); text-shadow: 0 0 18px rgba(251,191,36,.7); }
  .stars .off { color: #334155; }
  @keyframes starIn { from { transform: scale(0) rotate(-90deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  .bd { margin: 10px 0 0; padding: 8px 12px; background: #0b1324; border: 1px solid var(--line); border-radius: 14px; font-size: 13px; text-align: left; }
  .bd > div { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
  .bd .minus { color: var(--rose); }
  .bd .total { border-top: 1px dashed #334155; margin-top: 4px; padding-top: 6px; font-size: 16px; color: var(--amber); }
  .bonus { margin-top: 10px; text-align: left; display: grid; gap: 6px; }
  .bonus > div { background: #0b1324; border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px; animation: slideIn .35s ease-out both; }
  .bonus > div.got { border-color: #a16207; background: linear-gradient(90deg, #2a1f0d, #0b1324); }
  @keyframes slideIn { from { transform: translateX(-24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .bonus .head { display: flex; justify-content: space-between; font-size: 13px; font-weight: 900; }
  .bonus .got .head { color: var(--amber); }
  .bonus .miss .head { color: #64748b; }
  .bonus small { display: block; font-size: 11px; line-height: 1.5; color: #94a3b8; font-weight: 700; margin-top: 2px; }
  .memo {
    margin-top: 12px;
    text-align: left;
    background: linear-gradient(135deg, #0c2a4a, #172554);
    border: 1px solid #1d4ed8;
    border-radius: 14px;
    padding: 10px 12px;
  }
  .memo b { display: block; font-size: 12px; color: var(--sky); margin-bottom: 2px; }
  .memo p { margin: 0; font-size: 12.5px; }
  .big-emoji { font-size: 52px; line-height: 1; }
  .fail h2 { color: var(--rose); }
  .total-score { font-size: 46px; font-weight: 900; color: var(--amber); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .rank-title {
    display: inline-block;
    margin-top: 4px;
    padding: 4px 14px;
    border-radius: 999px;
    background: linear-gradient(90deg, #f59e0b, #f97316);
    color: #1c0d00;
    font-weight: 900;
    font-size: 15px;
  }
  .recruit {
    margin-top: 14px;
    text-align: left;
    background: linear-gradient(135deg, #082f49, #1e1b4b);
    border: 1px solid #0ea5e9;
    border-radius: 16px;
    padding: 12px;
  }
  .recruit b { font-size: 14px; color: #fff; }
  .recruit p { font-size: 12.5px; }
  .share-label { margin-top: 14px; font-size: 11px; color: var(--muted); }
  .loading { color: #0f172a; font-size: 15px; font-weight: 900; text-align: center; line-height: 1.8; }
</style>

<body>

<canvas id="scene"></canvas>

<div id="app">
  <header class="hud">
    <div class="hud-stage">
      <span id="stageTag" class="tag">STAGE 1/5</span>
      <span id="stageName">はじめての引き込み</span>
    </div>
    <button id="soundBtn" class="icon-btn" aria-label="効果音の切り替え">🔊</button>
  </header>

  <div id="costbar" class="costbar"><div id="costFill"></div><div id="estMark"></div><span id="costText">施工費 0万 / 予算 20万</span></div>
  <div class="chips">
    <span>見積り <b id="estText">13万</b></span>
    <span id="bendChip">曲がり <b id="bendText">0/2</b></span>
    <span id="failChip">手戻り <b id="failText">0回</b></span>
  </div>

  <div id="boardWrap"></div>

  <div class="palette" id="palette">
    <button class="part on" data-tool="straight"><canvas></canvas><span>直管</span><b>1万</b></button>
    <button class="part" data-tool="elbow"><canvas></canvas><span>エルボ</span><b>2万</b></button>
    <button class="part" data-tool="tee"><canvas></canvas><span>T字管</span><b>3万</b></button>
    <button class="part" data-tool="cross"><canvas></canvas><span>立体交差</span><b>5万</b></button>
    <button class="part" data-tool="erase"><canvas></canvas><span>撤去</span><b>0</b></button>
  </div>

  <div class="controls">
    <button id="clearBtn" class="btn btn-ghost small" aria-label="置いた管を全部撤去">🗑</button>
    <button id="actionBtn" class="btn btn-primary grow" disabled>💧 通水テスト</button>
  </div>
</div>

<div id="fx"><div id="combo" class="combo">💧 0本</div></div>
<div id="overlay" class="overlay show"><div class="loading" id="loadingMsg">現場を準備中…</div></div>

<script>
  // 3D の読み込み（CDN）に失敗したときだけ案内を出す
  setTimeout(function () {
    if (!window.__pcReady) {
      var el = document.getElementById('loadingMsg');
      if (el) el.innerHTML = '読み込みに失敗しました。<br>通信環境を確認して、再読み込みしてください。';
    }
  }, 12000);
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================================
   設定
   ============================================================================ */
// 求人ページ（怪人など）のURLを入れると、最終結果画面に「求人を見る」ボタンが出る
const RECRUIT_URL = '';
const SITE_URL = 'https://matsushita-pipe-craft.pages.dev/';

const COLS = 7, ROWS = 9;

/* ============================================================================
   管の形
   ============================================================================ */
const dirsOf = m => DIRS.filter(d => m & d);
const isElbow = m => m === (N | E) || m === (E | S) || m === (S | W) || m === (W | N);
const isStraight = m => m === (N | S) || m === (E | W);

// 角管の水路：2辺の中点を、共有する角を中心とした1/4円でつなぐ
function arcPts(a, b) {
  const m = a | b;
  const cx = (m & E) ? 1 : 0, cy = (m & N) ? 0 : 1;
  const pa = EDGE[a], pb = EDGE[b];
  const a0 = Math.atan2(pa[1] - cy, pa[0] - cx);
  let d = Math.atan2(pb[1] - cy, pb[0] - cx) - a0;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  const pts = [];
  for (let i = 0; i <= 12; i++) {
    const t = a0 + d * i / 12;
    pts.push([cx + 0.5 * Math.cos(t), cy + 0.5 * Math.sin(t)]);
  }
  return pts;
}

// 入口から見た出口（立体交差はまっすぐ抜けるだけ、T字管は2方向に分かれる）
function exitsFor(mask, entry) {
  if (mask === CROSS) return [OPP[entry]];
  return dirsOf(mask).filter(d => d !== entry);
}

// 水の通り道（マス内 0〜1 座標の折れ線）
function waterPaths(mask, entry, exits) {
  if (entry === null) return exits.map(d => [[0.5, 0.5], EDGE[d]]);
  if (isElbow(mask)) return [arcPts(entry, exits[0])];
  return exits.map(d => [EDGE[entry], [0.5, 0.5], EDGE[d]]);
}

/* ============================================================================
   効果音（Web Audio のシンセ。音声ファイル不要）
   ============================================================================ */
let audioCtx = null;
let soundOn = true;

function ac() {
  if (!audioCtx) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (C) audioCtx = new C();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone(freq, dur, { type = 'sine', vol = 0.2, to = null, delay = 0 } = {}) {
  if (!soundOn) return;
  const a = ac();
  if (!a) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g);
  g.connect(a.destination);
  o.start(t);
  o.stop(t + dur + 0.02);
}

function noise(dur, { freq = 800, type = 'lowpass', vol = 0.3, delay = 0 } = {}) {
  if (!soundOn) return;
  const a = ac();
  if (!a) return;
  const t = a.currentTime + delay;
  const len = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource();
  src.buffer = buf;
  const f = a.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f);
  f.connect(g);
  g.connect(a.destination);
  src.start(t);
}

function buzz(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* 非対応端末 */ }
}

const $ = id => document.getElementById(id);
const easeOutBack = k => 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2);
function easeOutBounce(k) {
  if (k < 1 / 2.75) return 7.5625 * k * k;
  if (k < 2 / 2.75) return 7.5625 * (k -= 1.5 / 2.75) * k + 0.75;
  if (k < 2.5 / 2.75) return 7.5625 * (k -= 2.25 / 2.75) * k + 0.9375;
  return 7.5625 * (k -= 2.625 / 2.75) * k + 0.984375;
}

      f.position.copy(local(u + (0.5 - u) * 0.07, v + (0.5 - v) * 0.07));
      f.rotation.z = (d === E || d === W) ? Math.PI / 2 : 0;
      f.rotation.x = (d === N || d === S) ? Math.PI / 2 : 0;
      g.add(f);
    }
    return g;
  }

  // ---------- 現場の土台 ----------
  const world = new THREE.Group();
  scene.add(world);
  let stageGroup = null;
  const tiles = new Map();
  const pipeViews = new Map();
  const houseViews = new Map();
  let sourceView = null;
  let waters = [];
  const decorSway = [];

  function buildIsland() {
    const w = COLS + RIM * 2, front = ROWS / 2 + RIM, back = ROWS / 2 + BACK, d = front + back;
    const block = mesh(new RoundedBoxGeometry(w, 1.0, d, 3, 0.12), [M.soilSide, M.soilSide, M.grass, M.under, M.soilSide, M.soilSide]);
    block.position.set(0, -0.14 - 0.5, (front - back) / 2);
    world.add(block);

    // 浮き島の下の岩肌
    const under = new THREE.CylinderGeometry(1, 0.28, 2.6, 9, 3);
    const pos = under.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      if (Math.abs(pos.getY(i)) < 1.29) {
        pos.setX(i, pos.getX(i) * (0.85 + Math.random() * 0.3));
        pos.setZ(i, pos.getZ(i) * (0.85 + Math.random() * 0.3));
      }
    }
    under.computeVertexNormals();
    const u = shadowed(new THREE.Mesh(under, M.under), false, false);
    u.scale.set(w * 0.47, 1, d * 0.47);
    u.position.set(0, -1.14 - 1.3, (front - back) / 2);
    world.add(u);

    // 道路（本管が通っている）
    const road = mesh(new THREE.BoxGeometry(w - 0.1, 0.04, 0.7), M.road);
    road.position.set(0, -0.12, -(ROWS / 2 + 0.6));
    world.add(road);
    for (let x = -w / 2 + 0.5; x < w / 2 - 0.3; x += 0.9) {
      const dash = mesh(new THREE.BoxGeometry(0.45, 0.045, 0.06), M.white);
      dash.position.set(x, -0.1, -(ROWS / 2 + 0.6));
      world.add(dash);
    }
    const mainPipe = mesh(new THREE.CylinderGeometry(0.12, 0.12, w - 0.2, 16), M.main);
    mainPipe.rotation.z = Math.PI / 2;
    mainPipe.position.set(0, -0.02, -(ROWS / 2 + 0.25));
    world.add(mainPipe);

    // 木と竹（奥と左右）
    let seed = 11;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 9; i++) {
      const t = makeTree(0.8 + rnd() * 0.5, rnd());
      t.position.set(-w / 2 + 0.5 + i * ((w - 1) / 8) + (rnd() - 0.5) * 0.3, -0.14, -(ROWS / 2 + 1.45 + rnd() * 0.25));
      world.add(t);
    }
    for (let i = 0; i < 3; i++) {
      const b = makeBamboo(rnd);
      b.position.set((i - 1) * 3.2 + (rnd() - 0.5), -0.14, -(ROWS / 2 + 1.75));
      world.add(b);
    }
    for (const side of [-1, 1]) {
      for (let i = 0; i < 4; i++) {
        const bush = makeBush(0.3 + rnd() * 0.15);
        bush.position.set(side * (COLS / 2 + RIM * 0.55), -0.14, -ROWS / 2 + 0.8 + i * 2.4 + rnd() * 0.5);
        world.add(bush);
      }
    }
    // 手前の花
    const flowerCols = [0xfacc15, 0xf472b6, 0xffffff, 0xfb923c];
    for (let i = 0; i < 16; i++) {
      const f = mesh(new THREE.SphereGeometry(0.05, 8, 6), std(flowerCols[i % 4], { emissive: flowerCols[i % 4], emissiveIntensity: 0.15 }));
      f.position.set(-COLS / 2 - 0.2 + rnd() * (COLS + 0.4), -0.1, ROWS / 2 + 0.15 + rnd() * 0.3);
      world.add(f);
    }
  }

  function makeTree(s, r) {
    const g = new THREE.Group();
    const trunk = mesh(new THREE.CylinderGeometry(0.05 * s, 0.08 * s, 0.45 * s, 7), M.trunk);
    trunk.position.y = 0.22 * s;
    g.add(trunk);
    const leaves = new THREE.Group();
    const mats = [M.leafA, M.leafB, M.leafC];
    [[0, 0.62, 0, 0.36], [0.16, 0.5, 0.08, 0.24], [-0.14, 0.52, -0.06, 0.22], [0.02, 0.85, 0, 0.24]].forEach(([x, y, z, rad], i) => {
      const l = mesh(new THREE.IcosahedronGeometry(rad * s, 0), mats[(i + Math.floor(r * 3)) % 3]);
      l.position.set(x * s, y * s, z * s);
      leaves.add(l);
    });
    g.add(leaves);
    decorSway.push({ obj: leaves, phase: r * 10 });
    return g;
  }

  function makeBamboo(rnd) {
    const g = new THREE.Group();
    for (let i = 0; i < 5; i++) {
      const h = 1.4 + rnd() * 0.9;
      const stalk = new THREE.Group();
      const pole = mesh(new THREE.CylinderGeometry(0.035, 0.04, h, 6), M.bamboo);
      pole.position.y = h / 2;
      stalk.add(pole);
      for (let k = 1; k < 4; k++) {
        const node = mesh(new THREE.TorusGeometry(0.04, 0.012, 4, 8), M.leafC);
        node.rotation.x = Math.PI / 2;
        node.position.y = (h / 4) * k;
        stalk.add(node);
      }
      const leaf = mesh(new THREE.IcosahedronGeometry(0.18, 0), M.leafB);
      leaf.scale.set(1, 0.5, 1);
      leaf.position.y = h;
      stalk.add(leaf);
      stalk.position.set((rnd() - 0.5) * 0.6, 0, (rnd() - 0.5) * 0.3);
      stalk.rotation.z = (rnd() - 0.5) * 0.12;
      g.add(stalk);
      decorSway.push({ obj: stalk, phase: rnd() * 10, amp: 0.03 });
    }
    return g;
  }

  function makeBush(s) {
    const g = new THREE.Group();
    [[0, 0.12, 0, 1], [0.15, 0.1, 0.05, 0.75], [-0.13, 0.09, -0.04, 0.7]].forEach(([x, y, z, k], i) => {
      const b = mesh(new THREE.IcosahedronGeometry(s * k * 0.6, 0), [M.leafA, M.leafB, M.leafC][i]);
      b.position.set(x, y, z);
      g.add(b);
    });
    return g;
  }

  // ---------- ステージの組み立て ----------
  const tileGeo = new RoundedBoxGeometry(0.94, 0.14, 0.94, 2, 0.04);

  function tileMat(c) {
    if (c.type === 'pipe') return M.trench;
    if (c.type === 'house') return M.lotGrass;
    if (c.type === 'source') return M.lotStone;
    if (c.type === 'rock') return M.lotRock;
    return (c.x + c.y) % 2 ? M.dirtA : M.dirtB;
  }

  function disposeTree(obj) {
    obj.traverse(o => { if (o.isMesh && o.geometry && !o.geometry.userData.shared) o.geometry.dispose(); });
  }

  function buildStage(stage, grid) {
    if (stageGroup) {
      world.remove(stageGroup);
      disposeTree(stageGroup);
    }
    stageGroup = new THREE.Group();
    world.add(stageGroup);
    tiles.clear();
    pipeViews.clear();
    houseViews.clear();
    waters = [];
    let houseIdx = 0;
    for (const row of grid) {
      for (const c of row) {
        const p = cellPos(c.x, c.y);
        if (c.type !== 'channel') {
          const t = shadowed(new THREE.Mesh(tileGeo, tileMat(c)), false, true);
          t.position.set(p.x, -0.07, p.z);
          stageGroup.add(t);
          tiles.set(`${c.x},${c.y}`, t);
        }
        if (c.type === 'rock') stageGroup.add(makeRock(p, c.x, c.y));
        if (c.type === 'channel') stageGroup.add(makeChannel(p, c, grid));
        if (c.type === 'house') {
          const hv = makeHouse(c, houseIdx++);
          stageGroup.add(hv.group);
          houseViews.set(`${c.x},${c.y}`, hv);
        }
        if (c.type === 'source') {
          sourceView = makeSource(c);
          stageGroup.add(sourceView.group);
        }
      }
    }
    stageGroup.add(hintArrow, leakX, tapRing);
  }
  tileGeo.userData.shared = true;
  flangeGeo.userData.shared = true;
  hubGeo.userData.shared = true;

  function makeRock(p, gx, gy) {
    const g = new THREE.Group();
    let seed = (gx * 7919 + gy * 104729 + 13) % 2147483647;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    [[0, 0, 0.36, M.rock], [0.22, 0.16, 0.18, M.rockDark], [-0.2, -0.18, 0.15, M.rock]].forEach(([x, z, r, mat]) => {
      const geo = new THREE.IcosahedronGeometry(r, 0);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) pos.setXYZ(i, pos.getX(i) * (0.85 + rnd() * 0.3), pos.getY(i) * (0.7 + rnd() * 0.25), pos.getZ(i) * (0.85 + rnd() * 0.3));
      geo.computeVertexNormals();
      const m = mesh(geo, mat);
      m.position.set(p.x + x, r * 0.55, p.z + z);
      m.rotation.y = rnd() * 6;
      g.add(m);
    });
    return g;
  }

  function makeChannel(p, c, grid) {
    const g = new THREE.Group();
    const isCh = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS && grid[y][x].type === 'channel';
    const horizontal = isCh(c.x - 1, c.y) || isCh(c.x + 1, c.y);
    const water = shadowed(new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.1, 1.0), M.channel), false, true);
    water.position.set(p.x, -0.16, p.z);
    if (!horizontal) water.rotation.y = Math.PI / 2;
    g.add(water);
    for (const side of [-1, 1]) {
      const bank = mesh(new THREE.BoxGeometry(1.0, 0.2, 0.08), M.concrete);
      bank.position.set(p.x, -0.05, p.z + side * 0.47);
      if (!horizontal) {
        bank.rotation.y = Math.PI / 2;
        bank.position.set(p.x + side * 0.47, -0.05, p.z);
      }
      g.add(bank);
    }
    return g;
  }

  function makeHouse(c, idx) {
    const g = new THREE.Group();
    g.position.copy(cellPos(c.x, c.y));
    const walls = [0xfff7e6, 0xf1f5f9, 0xe0f2fe][idx % 3];
    const roofs = [0xef6c35, 0xdc2626, 0x0d9488][idx % 3];
    const arm = buildPipe(c.dir);
    g.add(arm);
    const body = new THREE.Group();
    body.scale.setScalar(1.18);
    const wall = mesh(new RoundedBoxGeometry(0.62, 0.42, 0.56, 2, 0.04), std(walls));
    wall.position.y = 0.23;
    body.add(wall);
    const roof = mesh(new THREE.ConeGeometry(0.52, 0.34, 4), std(roofs, { flatShading: true }));
    roof.rotation.y = Math.PI / 4;
    roof.scale.set(1, 1, 0.92);
    roof.position.y = 0.61;
    body.add(roof);
    const chimney = mesh(new THREE.BoxGeometry(0.08, 0.18, 0.08), std(0x78716c));
    chimney.position.set(0.16, 0.7, -0.08);
    body.add(chimney);
    const door = mesh(new THREE.BoxGeometry(0.13, 0.2, 0.02), M.door);
    door.position.set(0, 0.12, 0.29);
    body.add(door);
    const win = new THREE.MeshStandardMaterial({ color: 0x64748b, emissive: 0xffd34d, emissiveIntensity: 0, roughness: 0.3 });
    for (const x of [-0.18, 0.18]) {
      const w = mesh(new THREE.BoxGeometry(0.12, 0.11, 0.02), win);
      w.position.set(x, 0.28, 0.29);
      body.add(w);
    }
    const sideWin = mesh(new THREE.BoxGeometry(0.02, 0.11, 0.12), win);
    sideWin.position.set(0.32, 0.28, 0);
    body.add(sideWin);
    g.add(body);
    const inlet = new THREE.Mesh(new THREE.TubeGeometry(curveOf([EDGE[c.dir], [0.5, 0.5]]), 4, R_WATER, 8), M.water);
    inlet.visible = false;
    g.add(inlet);
    return { group: g, body, win, inlet, bounceAt: -1e9 };
  }

  function labelSprite(text) {
    const tex = canvasTex(128, 64, (g, w, h) => {
      g.fillStyle = '#1d4ed8';
      g.beginPath();
      g.roundRect(4, 8, w - 8, h - 16, 18);
      g.fill();
      g.fillStyle = '#fff';
      g.font = "900 30px 'M PLUS Rounded 1c', sans-serif";
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(text, w / 2, h / 2 + 2);
    });
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
    s.scale.set(0.62, 0.31, 1);
    s.renderOrder = 10;
    return s;
  }

  function makeSource(c) {
    const g = new THREE.Group();
    g.position.copy(cellPos(c.x, c.y));
    const base = mesh(new THREE.CylinderGeometry(0.36, 0.4, 0.12, 20), M.concrete);
    base.position.y = 0.06;
    g.add(base);
    const riser = mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.34, 18), M.main);
    riser.position.y = 0.22;
    g.add(riser);
    g.add(buildPipe(c.dir));
    const wheel = new THREE.Group();
    const ring = mesh(new THREE.TorusGeometry(0.2, 0.035, 8, 24), M.valve);
    wheel.add(ring);
    for (const r of [0, Math.PI / 2]) {
      const spoke = mesh(new THREE.BoxGeometry(0.4, 0.03, 0.03), M.valve);
      spoke.rotation.z = r;
      wheel.add(spoke);
    }
    wheel.rotation.x = -Math.PI / 2;
    wheel.position.y = 0.46;
    g.add(wheel);
    const label = labelSprite('本管');
    label.position.y = 0.95;
    g.add(label);
    const ring2 = new THREE.Mesh(new THREE.RingGeometry(0.38, 0.46, 32), new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.6, side: THREE.DoubleSide }));
    ring2.rotation.x = -Math.PI / 2;
    ring2.position.y = 0.02;
    g.add(ring2);
    return { group: g, wheel, pulse: ring2 };
  }

  // 本管の出口に浮かぶ矢印、漏れた場所の ✕、タップした場所の輪
  const hintArrow = new THREE.Group();
  {
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.3, 4), M.hint);
    cone.rotation.x = Math.PI;
    hintArrow.add(cone);
    const plate = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.4, 4), new THREE.MeshBasicMaterial({ color: 0xfde047, transparent: true, opacity: 0.7, side: THREE.DoubleSide }));
    plate.rotation.x = -Math.PI / 2;
    plate.rotation.z = Math.PI / 4;
    plate.position.y = -0.5;
    hintArrow.add(plate);
  }
  const leakX = new THREE.Group();
  for (const r of [Math.PI / 4, -Math.PI / 4]) {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.06, 0.12), M.leakX);
    bar.rotation.y = r;
    leakX.add(bar);
  }
  const tapRing = new THREE.Mesh(new THREE.RingGeometry(0.36, 0.46, 32), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false }));
  tapRing.rotation.x = -Math.PI / 2;
  let tapAt = -1e9;

  // ---------- 管 ----------
  function setTile(c) {
    const t = tiles.get(`${c.x},${c.y}`);
    if (t) t.material = tileMat(c);
  }

  function removePipe(c) {
    const key = `${c.x},${c.y}`;
    const v = pipeViews.get(key);
    if (v) {
      stageGroup.remove(v.group);
      disposeTree(v.group);
      pipeViews.delete(key);
    }
    setTile(c);
  }

  function setPipe(c, anim) {
    removePipe(c);
    const g = buildPipe(c.mask);
    g.position.copy(cellPos(c.x, c.y));
    stageGroup.add(g);
    pipeViews.set(`${c.x},${c.y}`, { group: g, anim, at: performance.now(), landed: anim !== 'drop' });
    setTile(c);
  }

  // ---------- 水 ----------
  const headGeo = new THREE.SphereGeometry(R_WATER * 1.25, 12, 8);
  headGeo.userData.shared = true;

  function addWater(c, ch, seg) {
    const arch = c.type === 'pipe' && c.mask === CROSS && ch === 'v';
    const g = new THREE.Group();
    g.position.copy(cellPos(c.x, c.y));
    const parts = seg.paths.map(p => {
      const pts = arch ? archPoints(p[0][1], p[p.length - 1][1]) : p;
      const curve = curveOf(pts, arch);
      const tub = curve.isLineCurve3 ? 8 : 24;
      const geo = new THREE.TubeGeometry(curve, tub, R_WATER, 8, false);
      geo.setDrawRange(0, 0);
      const m = new THREE.Mesh(geo, M.water);
      g.add(m);
      const head = new THREE.Mesh(headGeo, M.head);
      head.visible = false;
      g.add(head);
      return { m, tub, curve, head };
    });
    stageGroup.add(g);
    waters.push({ g, seg, parts, cell: c });
  }

  function clearWater() {
    for (const w of waters) {
      stageGroup.remove(w.g);
      disposeTree(w.g);
    }
    waters = [];
    for (const hv of houseViews.values()) {
      hv.win.emissiveIntensity = 0;
      hv.inlet.visible = false;
    }
  }

  // ---------- 粒子 ----------
  class Pool {
    constructor(n, size, additive) {
      this.n = n;
      this.items = [];
      this.geo = new THREE.BufferGeometry();
      this.pos = new Float32Array(n * 3);
      this.col = new Float32Array(n * 3);
      this.geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
      this.geo.setAttribute('color', new THREE.BufferAttribute(this.col, 3));
      this.points = new THREE.Points(this.geo, new THREE.PointsMaterial({
        size, map: dotTex, vertexColors: true, transparent: true, depthWrite: false,
        blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending
      }));
      this.points.frustumCulled = false;
      scene.add(this.points);
    }
    spawn(p) {
      if (this.items.length >= this.n) this.items.shift();
      this.items.push(p);
    }
    update(dt) {
      const k = dt / 16;
      this.items = this.items.filter(p => (p.life -= p.decay * k) > 0);
      for (let i = 0; i < this.n; i++) {
        const p = this.items[i];
        if (!p) {
          this.pos[i * 3 + 1] = -999;
          continue;
        }
        p.vy -= p.g * k;
        p.x += p.vx * k;
        p.y += p.vy * k;
        p.z += p.vz * k;
        if (p.y < 0.02 && p.bounce) { p.y = 0.02; p.vy *= -0.3; p.vx *= 0.6; p.vz *= 0.6; }
        this.pos.set([p.x, p.y, p.z], i * 3);
        const f = Math.min(1, p.life * 1.5);
        this.col.set([p.c.r * f, p.c.g * f, p.c.b * f], i * 3);
      }
      this.geo.attributes.position.needsUpdate = true;
      this.geo.attributes.color.needsUpdate = true;
    }
  }
  const glow = new Pool(500, 0.16, true);
  const solid = new Pool(300, 0.11, false);

  const confettiN = 160;
  const confetti = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.09, 0.14), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }), confettiN);
  confetti.frustumCulled = false;
  confetti.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(confetti);
  let confItems = [];
  const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpE = new THREE.Euler(), tmpS = new THREE.Vector3(1, 1, 1), tmpV = new THREE.Vector3();
  const colorsConf = [0x38bdf8, 0xfbbf24, 0x4ade80, 0xf472b6, 0xa78bfa, 0xffffff].map(c => new THREE.Color(c));
  for (let i = 0; i < confettiN; i++) confetti.setColorAt(i, colorsConf[i % colorsConf.length]);

  function burstAt(p, n, colors, speed, { up = 0.06, g = 0.004, pool = glow, decay = 0.02, bounce = false } = {}) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = speed * (0.3 + Math.random());
      pool.spawn({
        x: p.x, y: p.y, z: p.z,
        vx: Math.cos(a) * v, vz: Math.sin(a) * v, vy: up * (0.5 + Math.random()),
        g, life: 1, decay: decay * (0.7 + Math.random() * 0.6), bounce,
        c: new THREE.Color(colors[i % colors.length])
      });
    }
  }

  // ---------- 画面上の文字 ----------
  const fx = $('fx');
  function toScreen(v) {
    const p = v.clone().project(camera);
    return { x: (p.x + 1) / 2 * window.innerWidth, y: (1 - p.y) / 2 * window.innerHeight };
  }
  function pop(cx, cy, text, cls = '', lift = 0.6) {
    const s = toScreen(cellPos(cx, cy).add(new THREE.Vector3(0, lift, 0)));
    const el = document.createElement('div');
    el.className = `pop ${cls}`;
    el.textContent = text;
    el.style.left = `${Math.min(window.innerWidth - 60, Math.max(60, s.x))}px`;
    el.style.top = `${s.y}px`;
    fx.appendChild(el);
    setTimeout(() => el.remove(), 1100);
  }
  function banner(html, cls, ms = 1700, yFrac = 0.4) {
    const r = $('boardWrap').getBoundingClientRect();
    const el = document.createElement('div');
    el.className = `banner ${cls}`;
    el.innerHTML = html;
    el.style.top = `${r.top + r.height * yFrac}px`;
    fx.appendChild(el);
    setTimeout(() => el.remove(), ms);
  }
  const comboEl = $('combo');
  function combo(n) {
    const r = $('boardWrap').getBoundingClientRect();
    comboEl.style.top = `${r.top + 4}px`;
    comboEl.textContent = `💧 ${n}本`;
    comboEl.classList.add('show');
    comboEl.classList.remove('bump');
    void comboEl.offsetWidth;
    comboEl.classList.add('bump');
  }
  const hideCombo = () => comboEl.classList.remove('show');

  // ---------- 演出 ----------
  function dropDust(c) {
    const p = cellPos(c.x, c.y);
    burstAt(new THREE.Vector3(p.x, 0.05, p.z), 14, [0xb08a63, 0x8a6a4a, 0xd6c3a5], 0.03, { up: 0.04, g: 0.003, pool: solid, decay: 0.03 });
  }
  function sparkleCell(c) {
    const p = cellPos(c.x, c.y);
    burstAt(new THREE.Vector3(p.x, P_Y + 0.1, p.z), 6, [0xa5f3fc, 0xffffff], 0.025, { up: 0.05, g: 0.002, decay: 0.035 });
  }
  function supply(c) {
    const hv = houseViews.get(`${c.x},${c.y}`);
    if (!hv) return;
    hv.win.emissiveIntensity = 2.4;
    hv.inlet.visible = true;
    hv.bounceAt = performance.now();
    const p = cellPos(c.x, c.y);
    burstAt(new THREE.Vector3(p.x, 0.5, p.z), 46, [0x22d3ee, 0xa5f3fc, 0xffffff, 0x86efac, 0xfde047], 0.06, { up: 0.12, g: 0.005, decay: 0.014 });
    cam.punchTo.copy(p);
    cam.punchAt = performance.now();
  }
  function leak(at) {
    cam.shake = 0.35;
    if (!at || at.d === undefined) return;
    leakSpray = { at, until: performance.now() + 1300 };
  }
  let leakSpray = null;
  function sprayTick() {
    if (!leakSpray || performance.now() > leakSpray.until) return;
    const { at } = leakSpray;
    const p = cellPos(at.x, at.y).add(local(EDGE[at.d][0], EDGE[at.d][1])).add(new THREE.Vector3(0.5, 0, 0.5));
    for (let i = 0; i < 5; i++) {
      const sp = 0.07 + Math.random() * 0.05;
      glow.spawn({
        x: p.x, y: p.y, z: p.z,
        vx: DX[at.d] * sp + (Math.random() - 0.5) * 0.04, vz: DY[at.d] * sp + (Math.random() - 0.5) * 0.04, vy: 0.06 + Math.random() * 0.06,
        g: 0.006, life: 1, decay: 0.025, bounce: true, c: new THREE.Color(Math.random() < 0.5 ? 0x22d3ee : 0xe0f2fe)
      });
    }
  }
  function celebrate() {
    confItems = [];
    for (let i = 0; i < confettiN; i++) {
      confItems.push({
        p: new THREE.Vector3((Math.random() - 0.5) * 3, 3 + Math.random() * 1.5, (Math.random() - 0.5) * 3),
        v: new THREE.Vector3((Math.random() - 0.5) * 0.12, 0.05 + Math.random() * 0.1, (Math.random() - 0.5) * 0.12),
        r: new THREE.Vector3(Math.random() * 6, Math.random() * 6, Math.random() * 6),
        vr: (Math.random() - 0.5) * 0.3
      });
    }
  }
  function legendary() {
    for (let i = 0; i < 6; i++) {
      const p = new THREE.Vector3((Math.random() - 0.5) * COLS, 0.6 + Math.random(), (Math.random() - 0.5) * ROWS);
      burstAt(p, 40, [0xff4d6d, 0xffb84d, 0xfff35c, 0x5cff8d, 0x4dc9ff, 0xb04dff, 0xffffff], 0.07, { up: 0.1, g: 0.003, decay: 0.012 });
    }
    celebrate();
    bloom.strength = 1.4;
  }
  function tapFx(c) {
    tapRing.position.copy(cellPos(c.x, c.y)).setY(0.02);
    tapAt = performance.now();
  }

  // ---------- カメラ ----------
  const camDir = new THREE.Vector3();
  function placeCamera(dist, target) {
    camDir.set(0, Math.sin(cam.pitch), Math.cos(cam.pitch));
    camera.position.copy(target).addScaledVector(camDir, dist);
    camera.lookAt(target);
    camera.updateMatrixWorld();
  }

  // 盤面が #boardWrap の範囲にぴったり収まる距離を探す
  function fit() {
    const W = window.innerWidth, H = window.innerHeight;
    renderer.setSize(W, H, false);
    composer.setSize(W, H);
    camera.aspect = W / H;
    const r = $('boardWrap').getBoundingClientRect();
    camera.setViewOffset(W, H, W / 2 - (r.left + r.width / 2), H / 2 - (r.top + r.height / 2), W, H);
    camera.updateProjectionMatrix();
    const hx = COLS / 2 + 0.25, hz = ROWS / 2 + 0.25;
    const corners = [[-hx, 0.4, -hz], [hx, 0.4, -hz], [-hx, 0, hz], [hx, 0, hz], [-hx, -0.9, ROWS / 2 + RIM], [hx, -0.9, ROWS / 2 + RIM]].map(a => new THREE.Vector3(...a));
    let lo = 4, hi = 80;
    for (let i = 0; i < 28; i++) {
      const mid = (lo + hi) / 2;
      placeCamera(mid, cam.target);
      const ok = corners.every(c => {
        const s = toScreen(c);
        return s.x >= r.left + 2 && s.x <= r.right - 2 && s.y >= r.top + 2 && s.y <= r.bottom - 2;
      });
      if (ok) hi = mid; else lo = mid;
    }
    cam.dist = hi;
    placeCamera(cam.dist, cam.target);
  }

  // ---------- 毎フレーム ----------
  const raycaster = new THREE.Raycaster();
  const ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const hit = new THREE.Vector3();

  function pick(clientX, clientY) {
    raycaster.setFromCamera(new THREE.Vector2((clientX / window.innerWidth) * 2 - 1, -(clientY / window.innerHeight) * 2 + 1), camera);
    if (!raycaster.ray.intersectPlane(ground, hit)) return null;
    const x = Math.round(hit.x + (COLS - 1) / 2), y = Math.round(hit.z + (ROWS - 1) / 2);
    return x >= 0 && y >= 0 && x < COLS && y < ROWS ? { x, y } : null;
  }

  let last = performance.now();
  function update(now, game) {
    const dt = Math.min(50, now - last);
    last = now;

    stripeTex.offset.x -= dt * 0.0016;
    channelTex.offset.x -= dt * 0.0003;
    for (const d of decorSway) d.obj.rotation.z = Math.sin(now * 0.0012 + d.phase) * (d.amp || 0.05);

    // 置いた管の落下・回転
    for (const [key, v] of pipeViews) {
      const k = Math.min(1, (now - v.at) / (v.anim === 'drop' ? 420 : 200));
      if (v.anim === 'drop') {
        v.group.position.y = (1 - easeOutBounce(k)) * 1.6;
        if (k > 0.35 && !v.landed) {
          v.landed = true;
          const [x, y] = key.split(',').map(Number);
          dropDust({ x, y });
          SFX.land();
        }
      } else if (v.anim === 'rotate') {
        v.group.rotation.y = (1 - easeOutBack(k)) * (Math.PI / 2);
      }
    }

    // 水の伸び
    for (const w of waters) {
      for (const p of w.parts) {
        const t = Math.min(1, w.seg.t);
        p.m.geometry.setDrawRange(0, Math.ceil(t * p.tub) * 8 * 6);
        p.head.visible = t > 0 && t < 1 && game.state === 'flow';
        if (p.head.visible) p.head.position.copy(p.curve.getPointAt(Math.min(1, t)));
      }
    }

    // 家のぴょこん
    for (const hv of houseViews.values()) {
      const k = (now - hv.bounceAt) / 600;
      const s = k < 1 ? Math.sin(k * Math.PI) * Math.exp(-k * 2) : 0;
      hv.body.scale.set(1 - s * 0.15, 1 + s * 0.35, 1 - s * 0.15);
    }

    if (sourceView) {
      if (game.state === 'flow') sourceView.wheel.rotation.z += dt * 0.012;
      const p = (now % 1400) / 1400;
      sourceView.pulse.visible = game.state === 'design';
      sourceView.pulse.scale.setScalar(1 + p * 0.6);
      sourceView.pulse.material.opacity = 0.7 * (1 - p);
    }

    // ヒント
    hintArrow.visible = false;
    if (game.state === 'design' || game.state === 'intro') {
      const s0 = game.source;
      const tx = s0.x + DX[s0.dir], ty = s0.y + DY[s0.dir];
      const tc = game.grid[ty][tx];
      if (!(tc.type === 'pipe' && (tc.mask & OPP[s0.dir]))) {
        hintArrow.visible = true;
        hintArrow.position.copy(cellPos(tx, ty)).setY(0.62 + Math.sin(now * 0.006) * 0.08);
      }
    }
    leakX.visible = !!game.leakMark && game.state === 'design';
    if (leakX.visible) {
      leakX.position.copy(cellPos(game.leakMark.x, game.leakMark.y)).setY(0.08);
      leakX.scale.setScalar(1 + Math.sin(now * 0.01) * 0.1);
    }
    const tk = (now - tapAt) / 350;
    tapRing.material.opacity = tk < 1 ? 0.8 * (1 - tk) : 0;
    tapRing.scale.setScalar(0.7 + Math.min(1, tk) * 0.5);

    sprayTick();
    glow.update(dt);
    solid.update(dt);

    if (confItems.length) {
      const k = dt / 16;
      confItems.forEach((c, i) => {
        c.v.y -= 0.004 * k;
        c.v.multiplyScalar(0.99);
        c.p.addScaledVector(c.v, k);
        c.r.x += c.vr * k;
        c.r.y += c.vr * 0.7 * k;
        tmpQ.setFromEuler(tmpE.set(c.r.x, c.r.y, c.r.z));
        tmpM.compose(c.p, tmpQ, tmpS);
        confetti.setMatrixAt(i, tmpM);
      });
      confetti.instanceMatrix.needsUpdate = true;
      if (confItems.every(c => c.p.y < -3)) confItems = [];
    } else {
      tmpM.makeScale(0, 0, 0);
      for (let i = 0; i < confettiN; i++) confetti.setMatrixAt(i, tmpM);
      confetti.instanceMatrix.needsUpdate = true;
    }
    bloom.strength += (0.65 - bloom.strength) * Math.min(1, dt / 900);

    // カメラ（給水した家に一瞬寄る、漏水で揺れる）
    const pk = (now - cam.punchAt) / 900;
    const punch = pk < 1 ? Math.sin(pk * Math.PI) : 0;
    const target = tmpV.copy(cam.target).lerp(cam.punchTo, punch * 0.35);
    placeCamera(cam.dist * (1 - punch * 0.14), target);
    if (cam.shake > 0.005) {
      camera.position.x += (Math.random() - 0.5) * cam.shake;
      camera.position.y += (Math.random() - 0.5) * cam.shake;
      cam.shake *= 0.9;
    }
  }

  function render() {
    composer.render();
  }

  buildIsland();

  return {
    buildStage, setPipe, removePipe, addWater, clearWater, supply, leak, celebrate, legendary,
    pop, banner, combo, hideCombo, sparkleCell, dropDust, tapFx, pick, fit, update, render
  };
})();

/* ============================================================================
   ゲーム状態
   ============================================================================ */
const G = {
  state: 'title',   // title / intro / design / flow / leaking / clearing / result
  stageIdx: 0,
  grid: null,
  source: null,
  tool: 'straight',
  heads: [],
  fails: 0,
  stats: null,
  firstSplit: null,
  leak: null,
  leakMark: null,
  doneAt: 0,
  result: null,
  cardAt: 0,
  results: [],
  now: 0
};

const pipeCells = () => G.grid.flat().filter(c => c.type === 'pipe');
const partsCost = () => pipeCells().reduce((a, c) => a + PARTS[c.part].price, 0);
const totalCost = () => partsCost() + G.fails * REWORK_COST;
const bendCount = () => pipeCells().filter(c => c.part === 'elbow').length;

function buildStage(i) {
  const st = STAGES[i];
  G.stageIdx = i;
  G.source = st.source;
  G.grid = Array.from({ length: ROWS }, (_, y) =>
    Array.from({ length: COLS }, (_, x) => ({ x, y, type: 'empty', part: null, mask: 0, segs: {} })));
  st.rocks.forEach(([x, y]) => { G.grid[y][x].type = 'rock'; });
  st.channel.forEach(([x, y]) => { G.grid[y][x].type = 'channel'; });
  const src = G.grid[st.source.y][st.source.x];
  src.type = 'source';
  src.dir = st.source.dir;
  st.houses.forEach(h => {
    const c = G.grid[h.y][h.x];
    c.type = 'house';
    c.dir = h.dir;
    c.supplied = false;
  });
  G.heads = [];
  G.fails = 0;
  G.leak = null;
  G.leakMark = null;
  G.result = null;
  View.buildStage(st, G.grid);
  resetWater();
  $('stageTag').textContent = `STAGE ${i + 1}/${STAGES.length}`;
  $('stageName').textContent = st.name;
  updateHud();
}

function startStage(i, skipIntro) {
  buildStage(i);
  if (skipIntro) {
    hideOverlay();
    G.state = 'design';
  } else {
    G.state = 'intro';
    showIntro();
  }
  syncButtons();
}

// 通水テストのやり直し用に、水だけを抜く（置いた管はそのまま）
function resetWater() {
  for (const c of G.grid.flat()) {
    c.segs = {};
    if (c.type === 'house') c.supplied = false;
  }
  G.heads = [];
  G.stats = { pipes: 0, houses: 0 };
  G.firstSplit = null;
  View.clearWater();
  View.hideCombo();
}

/* ============================================================================
   操作
   ============================================================================ */
const neighbor = (x, y, d) => {
  const nx = x + DX[d], ny = y + DY[d];
  return nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS ? null : G.grid[ny][nx];
};

// 隣のマスから、このマスに向かって口が開いているか
function portInto(x, y, d) {
  const n = neighbor(x, y, d);
  if (!n) return false;
  if (n.type === 'pipe') return !!(n.mask & OPP[d]);
  if (n.type === 'source' || n.type === 'house') return n.dir === OPP[d];
  return false;
}

function portBlocked(x, y, d) {
  const n = neighbor(x, y, d);
  if (!n) return true;
  if (n.type === 'rock' || n.type === 'channel') return true;
  if (n.type === 'source' || n.type === 'house') return n.dir !== OPP[d];
  if (n.type === 'pipe') return !(n.mask & OPP[d]);
  return false;
}

// 隣の管が、今つながっている口を保ったまま dir 側にも口を向けられるなら、その向きを返す
function adaptOrient(q, dir) {
  if (!q || q.type !== 'pipe' || (q.mask & dir)) return null;
  const keep = dirsOf(q.mask).filter(d => portInto(q.x, q.y, d));
  return PARTS[q.part].orients.find(m => (m & dir) && keep.every(d => m & d)) ?? null;
}

// 置いた瞬間に、まわりとつながる向きを自動で選ぶ（違えばタップで回転）。
// まだどこにもつながっていない隣の口は、こちらに向け直せるものとして数える
function bestOrient(x, y, orients) {
  let best = orients[0], bestScore = -Infinity;
  for (const m of orients) {
    let score = 0;
    for (const d of dirsOf(m)) {
      if (portInto(x, y, d)) score += 3;
      else if (adaptOrient(neighbor(x, y, d), OPP[d]) !== null) score += 2;
      else if (portBlocked(x, y, d)) score -= 2;
    }
    if (score > bestScore) {
      best = m;
      bestScore = score;
    }
  }
  return best;
}

// 置いた管に向けて、隣の「宙ぶらりんの口」を回してつなぐ
function adaptNeighbors(c) {
  for (const d of dirsOf(c.mask)) {
    const q = neighbor(c.x, c.y, d);
    const m = adaptOrient(q, OPP[d]);
    if (m !== null) {
      q.mask = m;
      View.setPipe(q, 'rotate');
    }
  }
}

function placeAt(x, y) {
  if (G.state !== 'design') return;
  const c = G.grid[y][x];
  View.tapFx(c);
  if (c.type === 'rock' || c.type === 'channel' || c.type === 'source' || c.type === 'house') {
    SFX.deny();
    View.pop(x, y, c.type === 'rock' ? '岩盤は掘れない！' : c.type === 'channel' ? '用水路には置けない！' : 'ここには置けない', 'bad');
    return;
  }
  G.leakMark = null;
  if (G.tool === 'erase') {
    if (c.type !== 'pipe') return;
    const price = PARTS[c.part].price;
    c.type = 'empty';
    c.part = null;
    c.mask = 0;
    View.removePipe(c);
    View.dropDust(c);
    SFX.remove();
    View.pop(x, y, `撤去 −${price}万`, '');
  } else if (c.type === 'pipe' && c.part === G.tool) {
    const o = PARTS[c.part].orients;
    c.mask = o[(o.indexOf(c.mask) + 1) % o.length];
    View.setPipe(c, 'rotate');
    SFX.rotate();
  } else {
    const part = PARTS[G.tool];
    c.type = 'empty'; // 置き換えのときは、古い管の口を数えないようにいったん空にして向きを決める
    c.mask = bestOrient(x, y, part.orients);
    c.type = 'pipe';
    c.part = G.tool;
    View.setPipe(c, 'drop');
    adaptNeighbors(c);
    View.pop(x, y, `${part.price}万`, 'gold');
    SFX.place();
  }
  buzz(8);
  updateHud();
}

function selectTool(tool) {
  G.tool = tool;
  document.querySelectorAll('.part').forEach(b => b.classList.toggle('on', b.dataset.tool === tool));
  SFX.select();
}

function clearAll() {
  if (G.state !== 'design') return;
  const list = pipeCells();
  for (const c of list) {
    c.type = 'empty';
    c.part = null;
    c.mask = 0;
    View.removePipe(c);
    View.dropDust(c);
  }
  G.leakMark = null;
  if (list.length) SFX.remove();
  updateHud();
}

function startTest() {
  if (G.state !== 'design') return;
  const st = STAGES[G.stageIdx];
  if (totalCost() > st.budget) {
    SFX.deny();
    View.banner('予算オーバー！<small>部材を見直そう</small>', 'red', 1500);
    return;
  }
  resetWater();
  G.leakMark = null;
  G.result = null;
  G.state = 'flow';
  const src = G.grid[st.source.y][st.source.x];
  src.segs.a = { entry: null, exits: [src.dir], t: 0, done: false, paths: waterPaths(0, null, [src.dir]) };
  View.addWater(src, 'a', src.segs.a);
  G.heads = [{ x: src.x, y: src.y, ch: 'a' }];
  SFX.start();
  buzz(30);
  syncButtons();
  updateHud();
}

/* ============================================================================
   水の流れ
   ============================================================================ */
function stepFlow(dt) {
  // 流れ始めはゆっくり、つながるほど速く
  const ms = 300 * Math.max(0.5, 1 - G.stats.pipes * 0.025);
  const next = [];
  for (const h of G.heads) {
    const seg = G.grid[h.y][h.x].segs[h.ch];
    seg.t += dt / ms;
    if (seg.t < 1) {
      next.push(h);
      continue;
    }
    seg.t = 1;
    seg.done = true;
    onSegDone(h, seg, next);
    if (G.state !== 'flow') return;
  }
  G.heads = next;
  if (G.heads.length === 0) {
    fail(null, '水が家まで届かなかった…', '管どうしが合流して行き止まりに。');
  }
}

function onSegDone(h, seg, next) {
  const cell = G.grid[h.y][h.x];

  if (cell.type === 'pipe') {
    G.stats.pipes++;
    SFX.tick(G.stats.pipes);
    View.combo(G.stats.pipes);
    View.sparkleCell(cell);
    if (seg.exits.length === 2) {
      if (G.firstSplit === null) G.firstSplit = G.stats.pipes;
      SFX.split();
      View.pop(h.x, h.y, '分岐！', 'gold big', 0.9);
    }
  }

  for (const d of seg.exits) {
    const nx = h.x + DX[d], ny = h.y + DY[d];
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) {
      return fail({ x: h.x, y: h.y, d }, '現場の外に水が噴き出した！', '管の口が、現場の外を向いていた。');
    }
    const n = G.grid[ny][nx];
    const entry = OPP[d];
    if (n.type === 'house') {
      if (n.dir !== entry) return fail({ x: h.x, y: h.y, d }, '家の壁に水がぶつかった！', '家には「給水口」がある面からしか入らない。');
      if (!n.supplied) supply(n);
      if (G.state !== 'flow') return;
      continue;
    }
    if (n.type === 'empty') return fail({ x: h.x, y: h.y, d }, 'その先に管がない！', 'T字管の口がひとつ余っていないかもチェック。');
    if (n.type === 'rock') return fail({ x: h.x, y: h.y, d }, '岩盤にぶつかって水があふれた！', '岩盤の手前で曲げよう。');
    if (n.type === 'channel') return fail({ x: h.x, y: h.y, d }, '用水路に水が流れ込んだ！', '用水路はすき間から回り込もう。');
    if (n.type === 'source') return fail({ x: h.x, y: h.y, d }, '本管に逆流した！', '水は本管に戻せない。');
    if (!(n.mask & entry)) return fail({ x: h.x, y: h.y, d }, '管の向きが合わずに水漏れ！', '置いた管をもう一度タップすると回転できる。');
    const ch = n.mask === CROSS ? ((d === E || d === W) ? 'h' : 'v') : 'a';
    if (n.segs[ch]) continue; // すでに水が来ている管に合流
    const exits = exitsFor(n.mask, entry);
    n.segs[ch] = { entry, exits, t: 0, done: false, paths: waterPaths(n.mask, entry, exits) };
    View.addWater(n, ch, n.segs[ch]);
    next.push({ x: nx, y: ny, ch });
  }
}

function supply(house) {
  house.supplied = true;
  G.stats.houses++;
  View.supply(house);
  View.pop(house.x, house.y, '給水OK！', 'good big', 1.1);
  SFX.house();
  buzz([20, 40, 20]);
  const st = STAGES[G.stageIdx];
  if (G.stats.houses >= st.houses.length) {
    G.state = 'clearing';
    G.doneAt = G.now;
    View.celebrate();
    View.banner('全戸給水！', 'blue');
    SFX.clear();
    syncButtons();
    updateHud();
  }
}

function fail(at, title, tip) {
  G.state = 'leaking';
  G.doneAt = G.now;
  G.leak = at ? { ...at, title, tip } : { title, tip };
  View.leak(at);
  View.banner('水漏れ！', 'red', 1300);
  View.hideCombo();
  SFX.leak();
  buzz([60, 40, 140]);
  syncButtons();
}

/* ============================================================================
   採点
   ============================================================================ */
// 水が通ったまっすぐな直管が、何本続いているか（最長）
function longestStraight() {
  let best = 0;
  const wet = c => c && c.type === 'pipe' && c.part === 'straight' && Object.keys(c.segs).length > 0;
  for (const c of pipeCells()) {
    if (!wet(c)) continue;
    const [dx, dy] = c.mask === (E | W) ? [1, 0] : [0, 1];
    const prev = G.grid[c.y - dy] && G.grid[c.y - dy][c.x - dx];
    if (wet(prev) && prev.mask === c.mask) continue; // 区間の先頭からだけ数える
    let len = 0, x = c.x, y = c.y;
    while (y < ROWS && x < COLS && wet(G.grid[y][x]) && G.grid[y][x].mask === c.mask) {
      len++;
      x += dx;
      y += dy;
    }
    best = Math.max(best, len);
  }
  return best;
}

function scoreStage() {
  const st = STAGES[G.stageIdx];
  const cost = totalCost();
  const unused = pipeCells().filter(c => !Object.keys(c.segs).length).length;
  const bends = bendCount();
  const run = longestStraight();
  const list = [
    { key: 'bends', got: bends <= st.bends, note: `曲がり ${bends}回（目安 ${st.bends}回以内）` },
    { key: 'waste', got: unused === 0, note: `水の通らない管 ${unused}本` },
    { key: 'oneshot', got: G.fails === 0, note: `手戻り ${G.fails}回` },
    { key: 'straight', got: run >= 4, note: `直管の最長 ${run}本連続` }
  ];
  if (st.share) list.push({ key: 'share', got: G.firstSplit !== null && G.firstSplit >= st.share, note: `分岐の手前まで ${G.firstSplit ?? 0}本（目安 ${st.share}本以上）` });
  const bonusPts = list.filter(b => b.got).reduce((a, b) => a + BONUSES[b.key].pts, 0);
  const remain = st.budget - cost;
  const score = remain * 100 + st.houses.length * 1000 + bonusPts;
  const got = list.filter(b => b.got).length;
  const stars = 1 + (cost <= st.estimate ? 1 : 0) + (got >= 3 ? 1 : 0);
  return { cost, partsCost: partsCost(), remain, score, stars, list, got, bonusPts };
}

/* ============================================================================
   パレットのアイコン（2D）
   ============================================================================ */
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawIcon(ctx, s, mask) {
  const trace = () => {
    ctx.beginPath();
    if (isElbow(mask)) {
      const pts = arcPts(...dirsOf(mask));
      ctx.moveTo(pts[0][0] * s, pts[0][1] * s);
      pts.slice(1).forEach(p => ctx.lineTo(p[0] * s, p[1] * s));
    } else {
      for (const d of dirsOf(mask)) {
        ctx.moveTo(s / 2, s / 2);
        ctx.lineTo(EDGE[d][0] * s, EDGE[d][1] * s);
      }
    }
  };
  ctx.lineCap = 'butt';
  ctx.lineJoin = 'round';
  for (const [w, col] of [[0.44, '#0a0f1a'], [0.34, '#b9cde0'], [0.16, '#22d3ee']]) {
    ctx.lineWidth = w * s;
    ctx.strokeStyle = col;
    trace();
    ctx.stroke();
  }
}

function renderPalette() {
  const icons = { straight: E | W, elbow: E | S, tee: E | S | W, cross: CROSS };
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  document.querySelectorAll('.part').forEach(btn => {
    const cv = btn.querySelector('canvas');
    const size = 34;
    cv.width = size * dpr;
    cv.height = size * dpr;
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#5e3d27';
    rr(ctx, 0, 0, size, size, 7);
    ctx.fill();
    const m = icons[btn.dataset.tool];
    if (m) {
      drawIcon(ctx, size, m);
    } else {
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⛏️', size / 2, size / 2 + 1);
    }
  });
}

/* ============================================================================
   HUD・ボタン
   ============================================================================ */
function updateHud() {
  if (!G.grid) return;
  const st = STAGES[G.stageIdx];
  const cost = totalCost();
  const bar = $('costbar');
  $('costFill').style.width = `${Math.min(100, (cost / st.budget) * 100)}%`;
  $('estMark').style.left = `${(st.estimate / st.budget) * 100}%`;
  bar.classList.toggle('over-est', cost > st.estimate && cost <= st.budget);
  bar.classList.toggle('over-budget', cost > st.budget);
  $('costText').textContent = cost > st.budget
    ? `施工費 ${cost}万 / 予算 ${st.budget}万　予算オーバー！`
    : `施工費 ${cost}万 / 予算 ${st.budget}万`;
  $('estText').textContent = `${st.estimate}万`;
  const bends = bendCount();
  $('bendText').textContent = `${bends}/${st.bends}`;
  $('bendChip').className = bends <= st.bends ? 'good' : 'bad';
  $('failText').textContent = `${G.fails}回`;
  $('failChip').className = G.fails ? 'bad' : '';
}

function syncButtons() {
  const b = $('actionBtn');
  const design = G.state === 'design';
  b.disabled = !design;
  b.textContent = G.state === 'flow' ? '💧 通水中…' : '💧 通水テスト';
  $('clearBtn').disabled = !design;
  document.querySelectorAll('.part').forEach(p => { p.disabled = !design; });
}

/* ============================================================================
   画面（オーバーレイ）
   ============================================================================ */
const overlay = $('overlay');

function showOverlay(html) {
  overlay.innerHTML = html;
  overlay.classList.add('show');
}

function hideOverlay() {
  overlay.classList.remove('show');
  overlay.innerHTML = '';
}

function loadBest() {
  try { return Number(localStorage.getItem('mpc_best') || 0); } catch (e) { return 0; }
}

function saveBest(v) {
  try { localStorage.setItem('mpc_best', String(v)); } catch (e) { /* プライベートモード等 */ }
}

function showTitle() {
  G.state = 'title';
  buildStage(0);
  syncButtons();
  const best = loadBest();
  showOverlay(`
    <div class="card">
      <div class="brand">松下工業 presents</div>
      <h1 class="logo"><span>快感！</span><em>配管クラフト</em></h1>
      <p class="lead">便利な管ほど、値段も高い。<br>安く・うまく・漏らさずつないだら、プロの仕事。</p>
      <div class="prices">
        <div>直管<b>1万</b></div><div>エルボ<b>2万</b></div><div>T字管<b>3万</b></div><div>立体交差<b>5万</b></div>
      </div>
      <ol class="howto">
        <li>下の部材を選んで<b>マスをタップ</b>。もう一度タップで<b>回転</b></li>
        <li>できたら<b>通水テスト</b>。漏れたら直して再テスト（手戻り +${REWORK_COST}万）</li>
        <li>残った予算が得点に。現場で<b>よい組み方</b>をすると職人ボーナス！</li>
      </ol>
      <button class="btn btn-amber" data-act="start">▶ スタート（全5ステージ）</button>
      ${best ? `<div class="best">あなたのベスト：${best.toLocaleString()}点</div>` : ''}
    </div>`);
}

function bonusListHtml(keys) {
  return keys.map(k => `<div><div class="head"><span>${BONUSES[k].name}</span><span>+${BONUSES[k].pts}</span></div><small>${BONUSES[k].why}</small></div>`).join('');
}

function showIntro() {
  const st = STAGES[G.stageIdx];

  showOverlay(`
    <div class="card">
      <span class="tag">STAGE ${G.stageIdx + 1} / ${STAGES.length}</span>

      <div class="money">

      </div>

        <li><span class="st">★</span>職人ボーナスを3つ以上</li>
      </ul>
      <p style="font-size:12px;color:#8ea0bd;margin-top:12px">職人ボーナス（現場でよいとされる組み方）</p>

      <button class="btn btn-primary" data-act="go">設計スタート！</button>
    </div>`);
}

function showResultCard(r) {
  const st = STAGES[G.stageIdx];
  const last = G.stageIdx === STAGES.length - 1;
  r.list.filter(b => b.got).forEach((b, i) => SFX.coin(i));
  showOverlay(`
    <div class="card">
      <span class="tag">STAGE ${G.stageIdx + 1} CLEAR!</span>
      <div class="stars">${[0, 1, 2].map(i => `<span class="${i < r.stars ? 'on' : 'off'}" style="animation-delay:${0.1 + i * 0.15}s">★</span>`).join('')}</div>
      <ul class="missions">
        <li class="ok"><span class="st">★</span>全部の家に給水</li>
        <li class="${r.cost <= st.estimate ? 'ok' : 'ng'}"><span class="st">★</span>施工費 ${r.cost}万（見積り ${st.estimate}万以内）</li>
        <li class="${r.got >= 3 ? 'ok' : 'ng'}"><span class="st">★</span>職人ボーナス ${r.got}個（3つ以上）</li>
      </ul>
      <div class="bd">
        <div><span>部材費</span><span>${r.partsCost}万</span></div>
        ${G.fails ? `<div class="minus"><span>手戻り ×${G.fails}</span><span>${G.fails * REWORK_COST}万</span></div>` : ''}
        <div><span>残った予算 ${st.budget}−${r.cost}＝${r.remain}万</span><span>+${(r.remain * 100).toLocaleString()}</span></div>
        <div><span>給水 ×${st.houses.length}</span><span>+${(st.houses.length * 1000).toLocaleString()}</span></div>
        <div><span>職人ボーナス ×${r.got}</span><span>+${r.bonusPts.toLocaleString()}</span></div>
        <div class="total"><span>ステージ得点</span><span>${r.score.toLocaleString()}</span></div>
      </div>
      <div class="bonus">
        ${r.list.map((b, i) => `<div class="${b.got ? 'got' : 'miss'}" style="animation-delay:${0.3 + i * 0.12}s"><div class="head"><span>${b.got ? '✓' : '✕'} ${BONUSES[b.key].name}</span><span>${b.got ? '+' + BONUSES[b.key].pts : '—'}</span></div><small>${b.note}。${BONUSES[b.key].why}</small></div>`).join('')}
      </div>
      <div class="memo"><b>🔧 松下社長の現場メモ</b><p>${MEMOS[G.stageIdx]}</p></div>
      <div class="row2">
        <button class="btn btn-ghost" data-act="retry">↺ もう一回</button>
        <button class="btn btn-amber" data-act="next">${last ? '🏆 結果を見る' : '次のステージ ▶'}</button>
      </div>
    </div>`);
}

function showFail() {
  const L = G.leak;
  showOverlay(`
    <div class="card fail">
      <div class="big-emoji">💦</div>
      <h2>${L.title}</h2>
      <p>${L.tip}</p>
      <p style="font-size:12px;color:#8ea0bd">漏れた場所に<b style="color:#fb7185">✕</b>が付きます。管はそのまま残るので、直して再テストしよう。<br>再テストには手戻り費 <b style="color:#fbbf24">+${REWORK_COST}万</b> がかかります。</p>
      <div class="row2">
        <button class="btn btn-ghost" data-act="retry">最初から</button>
        <button class="btn btn-primary" data-act="fix">🔧 直す</button>
      </div>
    </div>`);
}

function rankTitle(stars) {
  if (stars >= 14) return '松下社長級の名職人';
  if (stars >= 10) return '頼れる職人';
  if (stars >= 6) return '一人前の配管工';
  return '見習い配管工';
}

function showFinal() {
  G.state = 'result';
  syncButtons();
  const total = G.results.reduce((a, r) => a + (r ? r.score : 0), 0);
  const stars = G.results.reduce((a, r) => a + (r ? r.stars : 0), 0);
  const title = rankTitle(stars);
  const best = loadBest();
  const isBest = total > best;
  if (isBest) saveBest(total);
  G.share = { total, title };
  View.celebrate();
  SFX.legend();
  showOverlay(`
    <div class="card">
      <span class="tag">ALL CLEAR!</span>
      <div class="big-emoji" style="margin-top:8px">🏆</div>
      <div class="total-score">${total.toLocaleString()}<small style="font-size:18px">点</small></div>
      <div style="font-size:13px;color:#8ea0bd">★ ${stars} / ${STAGES.length * 3}${isBest ? '　<b style="color:#fde047">ベスト更新！</b>' : `　ベスト ${best.toLocaleString()}点`}</div>
      <div class="rank-title">称号：${title}</div>
      <div class="share-label">結果をシェア</div>
      <div class="row2">
        <button class="btn btn-x" data-act="share-x">𝕏 でポスト</button>
        <button class="btn btn-line" data-act="share-line">LINEで送る</button>
      </div>
      <div class="recruit">
        <b>🔧 この仕事、本物は松下工業で。</b>
        <p>地面の下や壁の向こうで、街のライフラインを守るのが配管工。未経験から一生モノの技術を身につけませんか？</p>
        ${RECRUIT_URL ? `<a class="btn btn-amber" style="display:block;text-decoration:none" href="${RECRUIT_URL}" target="_blank" rel="noopener">求人を見る ▶</a>` : ''}
      </div>
      <button class="btn btn-primary" data-act="title">もう一度あそぶ</button>
    </div>`);
}

function shareText() {
  const { total, title } = G.share;
  return `快感！配管クラフトで${total.toLocaleString()}点！称号は「${title}」でした💧 #配管クラフト #松下工業`;
}

overlay.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  ac();
  const act = btn.dataset.act;
  if (act === 'start') {
    G.results = [];
    startStage(0, false);
  } else if (act === 'go') {
    hideOverlay();
    G.state = 'design';
    syncButtons();
    updateHud();
  } else if (act === 'fix') {
    // 管は残したまま水だけ抜いて設計に戻る。手戻りは1回分加算
    G.fails++;
    G.leakMark = G.leak && G.leak.d !== undefined ? { x: G.leak.x + DX[G.leak.d], y: G.leak.y + DY[G.leak.d] } : null;
    if (G.leakMark && (G.leakMark.x < 0 || G.leakMark.y < 0 || G.leakMark.x >= COLS || G.leakMark.y >= ROWS)) G.leakMark = { x: G.leak.x, y: G.leak.y };
    resetWater();
    hideOverlay();
    G.state = 'design';
    syncButtons();
    updateHud();
  } else if (act === 'retry') {
    startStage(G.stageIdx, true);
  } else if (act === 'next') {
    if (G.stageIdx < STAGES.length - 1) startStage(G.stageIdx + 1, false);
    else showFinal();
  } else if (act === 'title') {
    showTitle();
  } else if (act === 'share-x') {
    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(SITE_URL)}`, '_blank', 'noopener');
  } else if (act === 'share-line') {
    window.open(`https://line.me/R/share?text=${encodeURIComponent(shareText() + '\n' + SITE_URL)}`, '_blank', 'noopener');
  }
});

$('scene').addEventListener('pointerdown', e => {
  ac();
  const cell = View.pick(e.clientX, e.clientY);
  if (cell) placeAt(cell.x, cell.y);
});

$('palette').addEventListener('click', e => {
  const btn = e.target.closest('.part');
  if (btn && !btn.disabled) selectTool(btn.dataset.tool);
});

$('actionBtn').addEventListener('click', () => {
  ac();
  startTest();
});

$('clearBtn').addEventListener('click', clearAll);

$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) SFX.place();
});

/* ============================================================================
   メインループ
   ============================================================================ */
let lastTs = performance.now();

function update(dt) {
  if (G.state === 'flow') {
    stepFlow(dt);
  } else if (G.state === 'leaking') {
    if (G.now - G.doneAt > 1300 && !overlay.classList.contains('show')) showFail();
  } else if (G.state === 'clearing') {
    const t = G.now - G.doneAt;
    if (!G.result && t > 1100) {
      const st = STAGES[G.stageIdx];
      G.result = scoreStage();
      G.results[G.stageIdx] = { score: G.result.score, stars: G.result.stars };
      if (G.result.cost === st.estimate) View.banner('見積りピッタリ！', 'blue small', 1000, 0.66);
      else if (G.result.cost < st.estimate) View.banner('見積りより安い！', 'blue small', 1000, 0.66);
      if (G.result.stars === 3) {
        // ★3は「神配管」演出
        setTimeout(() => {
          View.legendary();
          View.banner('神配管！<small>PERFECT PIPING</small>', 'rainbow', 2400);
          SFX.legend();
          buzz([30, 30, 30, 30, 80]);
        }, 900);
        G.cardAt = G.now + 3100;
      } else {
        G.cardAt = G.now + 1100;
      }
    }
    if (G.result && G.now >= G.cardAt && !overlay.classList.contains('show')) {
      View.hideCombo();
      showResultCard(G.result);
    }
  }
}

function frame(ts) {
  const dt = Math.min(50, ts - lastTs);
  lastTs = ts;
  G.now = ts;
  update(dt);
  View.update(ts, G);
  View.render();
  requestAnimationFrame(frame);
}

window.addEventListener('resize', () => View.fit());
renderPalette();
showTitle();
View.fit();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { renderPalette(); View.fit(); });
window.__pcReady = true;
requestAnimationFrame(frame);

// テスト・デバッグ用（ブラウザのコンソールから操作できるように）
Object.assign(window, { G, View, placeAt, selectTool, startTest, startStage, update, totalCost, pipeCells, COLS, ROWS, N, E, S, W });
</script>
