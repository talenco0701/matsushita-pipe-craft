<style>
  :root {
    --bg: #0b1220;
    --panel: #121b2e;
    --line: #23324f;
    --sky: #38bdf8;
    --cyan: #22d3ee;
    --amber: #fbbf24;
    --rose: #fb7185;
    --green: #4ade80;
    --text: #e8eef8;
    --muted: #8ea0bd;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(120% 80% at 50% 0%, #15233d 0%, var(--bg) 60%);
    background-color: var(--bg);
    color: var(--text);
    font-family: 'M PLUS Rounded 1c', system-ui, sans-serif;
    font-weight: 800;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  button { font: inherit; }

  #app {
    max-width: 460px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    padding: calc(8px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* ---------- HUD ---------- */
  .hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .hud-stage { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .tag {
    flex-shrink: 0;
    background: var(--sky);
    color: #04121f;
    font-weight: 900;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    letter-spacing: .04em;
  }
  #stageName { font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
  }

  .costbar {
    position: relative;
    height: 24px;
    border-radius: 999px;
    background: #0a1324;
    border: 1px solid var(--line);
    overflow: hidden;
  }
  #costFill {
    position: absolute; inset: 0 auto 0 0;
    width: 0;
    background: linear-gradient(90deg, #16a34a, #4ade80);
    transition: width .2s, background .3s;
  }
  .costbar.over-est #costFill { background: linear-gradient(90deg, #d97706, #fbbf24); }
  .costbar.over-budget #costFill { background: linear-gradient(90deg, #e11d48, #fb7185); }
  #estMark {
    position: absolute; top: 0; bottom: 0;
    width: 2px;
    background: #fff;
    opacity: .7;
  }
  #costText {
    position: relative;
    display: block;
    text-align: center;
    font-size: 12px;
    line-height: 22px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.85);
  }
  .chips { display: flex; gap: 6px; justify-content: center; font-size: 11px; color: var(--muted); }
  .chips span { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }
  .chips b { color: var(--text); }
  .chips .good b { color: var(--green); }
  .chips .bad b { color: var(--rose); }

  #boardWrap {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #board {
    display: block;
    border-radius: 14px;
    box-shadow: 0 0 0 2px #3b2a1e, 0 12px 30px rgba(0,0,0,.5);
    touch-action: none;
    cursor: pointer;
  }

  /* ---------- 部材パレット ---------- */
  .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .part {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    padding: 5px 2px 4px;
    border-radius: 12px;
    border: 2px solid var(--line);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    transition: transform .08s;
  }
  .part:active { transform: scale(.95); }
  .part canvas { width: 34px; height: 34px; border-radius: 7px; }
  .part span { font-size: 10.5px; font-weight: 900; line-height: 1.2; }
  .part b { font-size: 11px; color: var(--amber); line-height: 1.1; }
  .part.on { border-color: var(--amber); background: #2a1f0d; box-shadow: 0 0 14px rgba(251,191,36,.35); }
  .part:disabled { opacity: .45; }

  .controls { display: flex; gap: 8px; }

  /* ---------- ボタン ---------- */
  .btn {
    border: 0;
    border-radius: 16px;
    padding: 13px 16px;
    font-weight: 900;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,.45);
    transition: transform .08s cubic-bezier(.34,1.56,.64,1), box-shadow .08s;
  }
  .btn:active:not(:disabled) { transform: translateY(4px) scale(.97); box-shadow: 0 1px 0 rgba(0,0,0,.45); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-primary { background: linear-gradient(90deg, #38bdf8, #22d3ee); color: #04121f; }
  .btn-amber { background: linear-gradient(90deg, #fbbf24, #f97316); color: #1c0d00; }
  .btn-ghost { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
  .btn-x { background: #000; color: #fff; border: 1px solid #333; }
  .btn-line { background: #06c755; color: #fff; }
  .grow { flex: 1; }
  .btn.small { padding: 13px 14px; }

  /* ---------- オーバーレイ ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(4, 8, 18, .78);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
  .overlay.show { display: flex; }
  .card {
    width: 100%;
    max-width: 400px;
    max-height: 100%;
    overflow-y: auto;
    background: linear-gradient(180deg, #16223a, #0f182b);
    border: 2px solid #2b4067;
    border-radius: 24px;
    padding: 20px 18px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.6);
    animation: pop .32s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card h2 { margin: 6px 0 4px; font-size: 22px; font-weight: 900; }
  .card p { margin: 6px 0; font-size: 13px; line-height: 1.6; color: #cdd8ea; font-weight: 700; }
  .card .btn { width: 100%; margin-top: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row2 .btn { margin-top: 10px; }

  .brand { font-size: 12px; color: var(--sky); letter-spacing: .2em; }
  .logo { margin: 6px 0 2px; font-size: 40px; line-height: 1.05; font-weight: 900; letter-spacing: -.01em; }
  .logo span { display: block; font-size: 26px; color: var(--amber); }
  .logo em { font-style: normal; background: linear-gradient(180deg, #fff 30%, #7dd3fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { font-size: 14px !important; color: #e2e8f0 !important; }
  .howto {
    text-align: left;
    margin: 12px 0 4px;
    padding: 10px 12px 10px 30px;
    background: #0b1324;
    border: 1px solid var(--line);
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.7;
    font-weight: 700;
    color: #cbd5e1;
  }
  .howto b { color: #fff; }
  .prices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .prices div { background: #0b1324; border: 1px solid var(--line); border-radius: 10px; padding: 6px 2px; font-size: 11px; }
  .prices b { display: block; color: var(--amber); font-size: 14px; }
  .best { margin-top: 10px; font-size: 12px; color: var(--muted); }

  .missions { list-style: none; margin: 12px 0 0; padding: 0; text-align: left; display: grid; gap: 6px; }
  .missions li {
    background: #0b1324;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 800;
    display: flex; gap: 8px; align-items: center;
  }
  .missions li .st { color: #475569; font-size: 16px; }
  .missions li.ok .st { color: var(--amber); }
  .missions li.ng { color: #7c8aa3; }
  .money { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  .money div { background: #0b1324; border: 1px solid var(--line); border-radius: 12px; padding: 8px; font-size: 11px; color: var(--muted); }
  .money b { display: block; font-size: 20px; color: var(--text); }

  .stars { font-size: 44px; letter-spacing: .08em; line-height: 1; margin: 6px 0; }
  .stars .on { color: var(--amber); text-shadow: 0 0 18px rgba(251,191,36,.6); }
  .stars .off { color: #334155; }
  .bd { margin: 10px 0 0; padding: 8px 12px; background: #0b1324; border: 1px solid var(--line); border-radius: 14px; font-size: 13px; text-align: left; }
  .bd > div { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
  .bd .minus { color: var(--rose); }
  .bd .total { border-top: 1px dashed #334155; margin-top: 4px; padding-top: 6px; font-size: 16px; color: var(--amber); }
  .bonus { margin-top: 10px; text-align: left; display: grid; gap: 6px; }
  .bonus > div { background: #0b1324; border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px; }
  .bonus > div.got { border-color: #a16207; background: linear-gradient(90deg, #2a1f0d, #0b1324); }
  .bonus .head { display: flex; justify-content: space-between; font-size: 13px; font-weight: 900; }
  .bonus .got .head { color: var(--amber); }
  .bonus .miss .head { color: #64748b; }
  .bonus small { display: block; font-size: 11px; line-height: 1.5; color: #94a3b8; font-weight: 700; margin-top: 2px; }
  .memo {
    margin-top: 12px;
    text-align: left;
    background: linear-gradient(135deg, #0c2a4a, #172554);
    border: 1px solid #1d4ed8;
    border-radius: 14px;
    padding: 10px 12px;
  }
  .memo b { display: block; font-size: 12px; color: var(--sky); margin-bottom: 2px; }
  .memo p { margin: 0; font-size: 12.5px; }
  .big-emoji { font-size: 52px; line-height: 1; }
  .fail h2 { color: var(--rose); }
  .total-score { font-size: 46px; font-weight: 900; color: var(--amber); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .rank-title {
    display: inline-block;
    margin-top: 4px;
    padding: 4px 14px;
    border-radius: 999px;
    background: linear-gradient(90deg, #f59e0b, #f97316);
    color: #1c0d00;
    font-weight: 900;
    font-size: 15px;
  }
  .recruit {
    margin-top: 14px;
    text-align: left;
    background: linear-gradient(135deg, #082f49, #1e1b4b);

  .recruit b { font-size: 14px; color: #fff; }
  .recruit p { font-size: 12.5px; }
  .share-label { margin-top: 14px; font-size: 11px; color: var(--muted); }
</style>

<div id="app">

<script>
'use strict';

/* ============================================================================
   設定
   ============================================================================ */
// 求人ページ（怪人など）のURLを入れると、最終結果画面に「求人を見る」ボタンが出る
const RECRUIT_URL = '';
const SITE_URL = 'https://matsushita-pipe-craft.pages.dev/';

const COLS = 7, ROWS = 9;
const N = 1, E = 2, S = 4, W = 8;
const DIRS = [N, E, S, W];
const DX = { [N]: 0, [E]: 1, [S]: 0, [W]: -1 };
const DY = { [N]: -1, [E]: 0, [S]: 1, [W]: 0 };
const OPP = { [N]: S, [E]: W, [S]: N, [W]: E };
const EDGE = { [N]: [0.5, 0], [E]: [1, 0.5], [S]: [0.5, 1], [W]: [0, 0.5] };
const ROT = { [N]: -Math.PI / 2, [E]: 0, [S]: Math.PI / 2, [W]: Math.PI };
const ARROW = { [N]: '↑', [E]: '→', [S]: '↓', [W]: '←' };
const CROSS = 15;

// 部材（便利なものほど高い）。orients はタップで回転する順番
const PARTS = {
  straight: { name: '直管', price: 1, orients: [E | W, N | S] },
  elbow: { name: 'エルボ', price: 2, orients: [N | E, E | S, S | W, W | N] },
  tee: { name: 'T字管', price: 3, orients: [W | N | E, N | E | S, E | S | W, S | W | N] },
  cross: { name: '立体交差', price: 5, orients: [CROSS] }
};
const REWORK_COST = 2; // 漏水して再テストするたびにかかる手戻り費（万円）

// house.dir = 家のどの面に給水口があるか / source.dir = 本管から水が出る向き
// estimate = プロの見積り（万円）、bends = 曲がりの目安、share = 分岐までに通す管の本数の目安
const STAGES = [
  {
    name: 'はじめての引き込み',
    sub: '道路の本管から、新築の家まで水を引き込もう。',
    budget: 20, estimate: 13, bends: 2, share: null,
    source: { x: 0, y: 1, dir: E },
    houses: [{ x: 6, y: 7, dir: W }],
    rocks: [], channel: []
  },
  {
    name: '用水路を越えろ',
    sub: 'まっすぐ下は用水路。端のすき間から回り込め！',
    budget: 26, estimate: 17, bends: 4, share: null,
    source: { x: 3, y: 0, dir: S },
    houses: [{ x: 3, y: 8, dir: N }],
    rocks: [], channel: [[1, 4], [2, 4], [3, 4], [4, 4], [5, 4]]
  },
  {
    name: '2軒同時に給水',
    sub: 'T字管で水を分けて、左右の家に届けよう。どこで分けると安い？',
    budget: 30, estimate: 20, bends: 2, share: 4,
    source: { x: 3, y: 0, dir: S },
    houses: [{ x: 0, y: 8, dir: N }, { x: 6, y: 8, dir: N }],
    rocks: [[3, 5]], channel: []
  },
  {
    name: '岩盤だらけの現場',
    sub: '掘れない岩盤をよけて、上と下の2軒へ。',
    budget: 32, estimate: 21, bends: 4, share: 3,
    source: { x: 0, y: 4, dir: E },
    houses: [{ x: 6, y: 0, dir: S }, { x: 6, y: 8, dir: N }],
    rocks: [[2, 2], [2, 6], [4, 1], [4, 4], [4, 7], [5, 3], [1, 7]], channel: []
  },
  {
    name: '100m 長距離バトル',
    sub: '用水路と岩盤を越えて、3軒すべてに給水せよ！',
    budget: 42, estimate: 30, bends: 4, share: null,
    source: { x: 0, y: 0, dir: S },
    houses: [{ x: 6, y: 2, dir: W }, { x: 6, y: 8, dir: W }, { x: 0, y: 8, dir: N }],
    rocks: [[2, 1], [5, 5], [1, 5]], channel: [[3, 2], [3, 3], [3, 5], [3, 6]]
  }
];

// 職人ボーナス（現場でよいとされる組み方）
const BONUSES = {
  bends: { name: '曲がり少なめ', pts: 500, why: '曲がりが少ないほど、水の勢い（水圧）が落ちにくい。' },
  waste: { name: 'ムダ管ゼロ', pts: 300, why: '水の通らない管は、ただの材料のムダ。使う分だけ発注するのがプロ。' },
  oneshot: { name: '一発通水', pts: 500, why: '手戻りゼロ。掘り直しは時間もお金もかかる。' },
  straight: { name: 'まっすぐ4本', pts: 300, why: 'まっすぐな区間は施工が早く、あとで点検もしやすい。' },
  share: { name: '幹線を共用', pts: 500, why: '家ごとに別々に引くより、途中まで1本で引いてから分ける方が材料が少なくて済む。' }
};

const MEMOS = [
  '公道の下の水道管は、深さ1.2m前後に埋めるのが基本。浅く埋めれば安く済むけど、道路管理者の許可が下りない。決まりを守るのもプロの技術。',
  '用水路を越えるときは、直角（90°）より45°曲げ。曲がりがゆるいほど水圧が落ちにくい。少し高くても、住んでから困らない方を選ぶ。',
  '家が2軒になれば、必要な水の量も増える。「ギリギリ足りる」設計だと、隣に家が建った途端に水が出なくなる。だから口径はワンサイズ余裕を持たせる。',
  '100m先まで送るなら、最初は太い管（φ40）で走って、25→20と段階的に絞る。細い管だけで引っ張ると、摩擦で水が出なくなる。',
  '水が出ないからと増圧ポンプで無理に押すと、細い管が破裂して大損害。ポンプに頼らず、管の太さと道すじの設計で解決するのが職人。'

/* ============================================================================
   管の形
   ============================================================================ */
const dirsOf = m => DIRS.filter(d => m & d);
const isElbow = m => m === (N | E) || m === (E | S) || m === (S | W) || m === (W | N);
const isStraight = m => m === (N | S) || m === (E | W);

// 角管の水路：2辺の中点を、共有する角を中心とした1/4円でつなぐ
function arcPts(a, b) {
  const m = a | b;
  const cx = (m & E) ? 1 : 0, cy = (m & N) ? 0 : 1;
  const pa = EDGE[a], pb = EDGE[b];
  const a0 = Math.atan2(pa[1] - cy, pa[0] - cx);
  let d = Math.atan2(pb[1] - cy, pb[0] - cx) - a0;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  const pts = [];
  for (let i = 0; i <= 12; i++) {
    const t = a0 + d * i / 12;
    pts.push([cx + 0.5 * Math.cos(t), cy + 0.5 * Math.sin(t)]);
  }
  return pts;
}

// 入口から見た出口（立体交差はまっすぐ抜けるだけ、T字管は2方向に分かれる）
function exitsFor(mask, entry) {
  if (mask === CROSS) return [OPP[entry]];
  return dirsOf(mask).filter(d => d !== entry);
}

// 水の通り道（マス内 0〜1 座標の折れ線）
function waterPaths(mask, entry, exits) {
  if (entry === null) return exits.map(d => [[0.5, 0.5], EDGE[d]]);
  if (isElbow(mask)) return [arcPts(entry, exits[0])];
  return exits.map(d => [EDGE[entry], [0.5, 0.5], EDGE[d]]);
}

/* ============================================================================
   効果音（Web Audio のシンセ。音声ファイル不要）
   ============================================================================ */
let audioCtx = null;
let soundOn = true;

function ac() {
  if (!audioCtx) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (C) audioCtx = new C();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone(freq, dur, { type = 'sine', vol = 0.2, to = null, delay = 0 } = {}) {
  if (!soundOn) return;
  const a = ac();
  if (!a) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g);
  g.connect(a.destination);
  o.start(t);
  o.stop(t + dur + 0.02);
}

function noise(dur, { freq = 800, type = 'lowpass', vol = 0.3, delay = 0 } = {}) {
  if (!soundOn) return;
  const a = ac();
  if (!a) return;
  const t = a.currentTime + delay;
  const len = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource();
  src.buffer = buf;
  const f = a.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f);
  f.connect(g);
  g.connect(a.destination);
  src.start(t);
}

const PENTA = [0, 2, 4, 7, 9];
const SFX = {
  place() { tone(520, 0.08, { to: 840, vol: 0.16 }); },
  rotate() { tone(700, 0.05, { to: 900, type: 'triangle', vol: 0.1 }); },
  select() { tone(980, 0.04, { type: 'triangle', vol: 0.08 }); },
  deny() { tone(150, 0.12, { type: 'square', vol: 0.05 }); },
  remove() { noise(0.16, { freq: 700, vol: 0.2 }); tone(300, 0.1, { to: 120, type: 'triangle', vol: 0.1 }); },
  // 管が1本満たされるたびに音階が上がっていく
  tick(n) {
    const step = n % 15;
    const semi = Math.floor(step / 5) * 12 + PENTA[step % 5];
    tone(330 * Math.pow(2, semi / 12), 0.1, { type: 'triangle', vol: 0.12 });
  },
  split() { tone(660, 0.12, { to: 990, type: 'sine', vol: 0.12 }); },
  house() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.28, { vol: 0.15, delay: i * 0.07 })); },
  leak() { noise(0.8, { freq: 500, vol: 0.5 }); tone(150, 0.5, { to: 45, type: 'sawtooth', vol: 0.1 }); },
  clear() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.32, { type: 'triangle', vol: 0.16, delay: i * 0.09 })); },
  coin(i) { tone(1319 + i * 120, 0.12, { type: 'square', vol: 0.05, delay: i * 0.12 }); },
  start() { noise(0.7, { freq: 1100, type: 'bandpass', vol: 0.3 }); tone(220, 0.35, { to: 440, vol: 0.08 }); }
};

function buzz(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* 非対応端末 */ }
}

/* ============================================================================
   ゲーム状態
   ============================================================================ */
const $ = id => document.getElementById(id);
const board = $('board');
const bctx = board.getContext('2d');
const bg = document.createElement('canvas');
const bgctx = bg.getContext('2d');
let DPR = 1, CELL = 48, BW = CELL * COLS, BH = CELL * ROWS;

const G = {
  state: 'title',   // title / intro / design / flow / leaking / clearing / result
  stageIdx: 0,
  grid: null,
  tool: 'straight',
  heads: [],
  fails: 0,
  stats: null,
  firstSplit: null,
  leak: null,
  leakMark: null,
  doneAt: 0,
  shake: 0,
  results: [],
  particles: [],
  floaters: [],
  now: 0
};

const pipeCells = () => G.grid.flat().filter(c => c.type === 'pipe');
const partsCost = () => pipeCells().reduce((a, c) => a + PARTS[c.part].price, 0);
const totalCost = () => partsCost() + G.fails * REWORK_COST;
const bendCount = () => pipeCells().filter(c => c.part === 'elbow').length;

function buildStage(i) {
  const st = STAGES[i];
  G.stageIdx = i;
  G.grid = Array.from({ length: ROWS }, (_, y) =>
    Array.from({ length: COLS }, (_, x) => ({ x, y, type: 'empty', part: null, mask: 0, segs: {}, placedAt: -1e9, rotAt: -1e9 })));
  st.rocks.forEach(([x, y]) => { G.grid[y][x].type = 'rock'; });
  st.channel.forEach(([x, y]) => { G.grid[y][x].type = 'channel'; });
  const src = G.grid[st.source.y][st.source.x];
  src.type = 'source';
  src.dir = st.source.dir;
  st.houses.forEach(h => {
    const c = G.grid[h.y][h.x];
    c.type = 'house';
    c.dir = h.dir;
    c.supplied = false;
  });
  G.heads = [];
  G.fails = 0;
  G.leak = null;
  G.leakMark = null;
  G.particles = [];
  G.floaters = [];
  resetWater();
  $('stageTag').textContent = `STAGE ${i + 1}/${STAGES.length}`;
  $('stageName').textContent = st.name;
  updateHud();
}

function startStage(i, skipIntro) {
  buildStage(i);
  if (skipIntro) {
    hideOverlay();
    G.state = 'design';
  } else {
    G.state = 'intro';
    showIntro();
  }
  syncButtons();
}

// 通水テストのやり直し用に、水だけを抜く（置いた管はそのまま）
function resetWater() {
  for (const c of G.grid.flat()) {
    c.segs = {};
    if (c.type === 'house') c.supplied = false;
  }
  G.heads = [];
  G.stats = { pipes: 0, houses: 0 };
  G.firstSplit = null;
}

/* ============================================================================
   操作
   ============================================================================ */
// 隣のマスから、このマスに向かって口が開いているか
function portInto(x, y, d) {
  const nx = x + DX[d], ny = y + DY[d];
  if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return false;
  const n = G.grid[ny][nx];
  if (n.type === 'pipe') return !!(n.mask & OPP[d]);
  if (n.type === 'source' || n.type === 'house') return n.dir === OPP[d];
  return false;
}

function portBlocked(x, y, d) {
  const nx = x + DX[d], ny = y + DY[d];
  if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return true;
  const n = G.grid[ny][nx];
  if (n.type === 'rock' || n.type === 'channel') return true;
  if (n.type === 'source' || n.type === 'house') return n.dir !== OPP[d];
  if (n.type === 'pipe') return !(n.mask & OPP[d]);
  return false;
}

// 隣の管が、今つながっている口を保ったまま dir 側にも口を向けられるなら、その向きを返す
function adaptOrient(q, dir) {
  if (!q || q.type !== 'pipe' || (q.mask & dir)) return null;
  const keep = dirsOf(q.mask).filter(d => portInto(q.x, q.y, d));
  return PARTS[q.part].orients.find(m => (m & dir) && keep.every(d => m & d)) ?? null;
}

const neighbor = (x, y, d) => {
  const nx = x + DX[d], ny = y + DY[d];
  return nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS ? null : G.grid[ny][nx];
};

// 置いた瞬間に、まわりとつながる向きを自動で選ぶ（違えばタップで回転）。
// まだどこにもつながっていない隣の口は、こちらに向け直せるものとして数える
function bestOrient(x, y, orients) {
  let best = orients[0], bestScore = -Infinity;
  for (const m of orients) {
    let score = 0;
    for (const d of dirsOf(m)) {
      if (portInto(x, y, d)) score += 3;
      else if (adaptOrient(neighbor(x, y, d), OPP[d]) !== null) score += 2;
      else if (portBlocked(x, y, d)) score -= 2;
    }
    if (score > bestScore) {
      best = m;
      bestScore = score;
    }
  }
  return best;
}

// 置いた管に向けて、隣の「宙ぶらりんの口」を回してつなぐ
function adaptNeighbors(c) {
  for (const d of dirsOf(c.mask)) {
    const q = neighbor(c.x, c.y, d);
    const m = adaptOrient(q, OPP[d]);
    if (m !== null) {
      q.mask = m;
      q.rotAt = G.now;
    }
  }
}

function placeAt(x, y) {
  if (G.state !== 'design') return;
  const c = G.grid[y][x];
  const cx = (x + 0.5) * CELL, cy = (y + 0.5) * CELL;
  if (c.type === 'rock' || c.type === 'channel' || c.type === 'source' || c.type === 'house') {
    SFX.deny();
    floater(cx, cy, c.type === 'rock' ? '岩盤は掘れない！' : c.type === 'channel' ? '用水路には置けない！' : 'ここには置けない', '#fda4af', 13);
    return;
  }
  G.leakMark = null;
  if (G.tool === 'erase') {
    if (c.type !== 'pipe') return;
    const price = PARTS[c.part].price;
    c.type = 'empty';
    c.part = null;
    c.mask = 0;
    SFX.remove();
    floater(cx, cy, `撤去 -${price}万`, '#cbd5e1', 13);
    burst(cx, cy, 12, ['#a16207', '#78350f', '#d6d3d1'], 3);
  } else if (c.type === 'pipe' && c.part === G.tool) {
    const o = PARTS[c.part].orients;
    c.mask = o[(o.indexOf(c.mask) + 1) % o.length];
    c.rotAt = G.now;
    SFX.rotate();
  } else {
    const part = PARTS[G.tool];
    c.type = 'empty'; // 置き換えのときは、古い管の口を数えないようにいったん空にして向きを決める
    c.mask = bestOrient(x, y, part.orients);
    c.type = 'pipe';
    c.part = G.tool;
    c.placedAt = G.now;
    adaptNeighbors(c);
    floater(cx, cy, `${part.price}万`, '#fde68a', 13);
    SFX.place();
  }
  buzz(8);
  updateHud();
}

function selectTool(tool) {
  G.tool = tool;
  document.querySelectorAll('.part').forEach(b => b.classList.toggle('on', b.dataset.tool === tool));
  SFX.select();
}

function clearAll() {
  if (G.state !== 'design') return;
  let n = 0;
  for (const c of pipeCells()) {
    c.type = 'empty';
    c.part = null;
    c.mask = 0;
    n++;
  }
  G.leakMark = null;
  if (n) SFX.remove();
  updateHud();
}

function startTest() {
  if (G.state !== 'design') return;
  const st = STAGES[G.stageIdx];
  if (totalCost() > st.budget) {
    SFX.deny();
    floater(BW / 2, BH * 0.4, '予算オーバー！ 部材を見直そう', '#fb7185', 17);
    return;
  }
  resetWater();
  G.leakMark = null;
  G.state = 'flow';
  const src = G.grid[st.source.y][st.source.x];
  src.segs.a = { entry: null, exits: [src.dir], t: 0, done: false, paths: waterPaths(0, null, [src.dir]) };
  G.heads = [{ x: src.x, y: src.y, ch: 'a' }];
  SFX.start();
  buzz(30);
  syncButtons();
  updateHud();
}

/* ============================================================================
   水の流れ
   ============================================================================ */
function stepFlow(dt) {
  // 流れ始めはゆっくり、つながるほど速く
  const ms = 260 * Math.max(0.5, 1 - G.stats.pipes * 0.025);
  const next = [];
  for (const h of G.heads) {
    const seg = G.grid[h.y][h.x].segs[h.ch];
    seg.t += dt / ms;
    if (seg.t < 1) {
      next.push(h);
      continue;
    }
    seg.t = 1;
    seg.done = true;
    onSegDone(h, seg, next);
    if (G.state !== 'flow') return;
  }
  G.heads = next;
  if (G.heads.length === 0) {
    fail(null, '水が家まで届かなかった…', '管どうしが合流して行き止まりに。');
  }
}

function onSegDone(h, seg, next) {
  const cell = G.grid[h.y][h.x];
  const cx = (h.x + 0.5) * CELL, cy = (h.y + 0.5) * CELL;

  if (cell.type === 'pipe') {
    G.stats.pipes++;
    SFX.tick(G.stats.pipes);
    if (seg.exits.length === 2) {
      if (G.firstSplit === null) G.firstSplit = G.stats.pipes;
      SFX.split();
      floater(cx, cy - CELL * 0.3, '分岐！', '#fde047', 15);
    }
  }

  for (const d of seg.exits) {
    const nx = h.x + DX[d], ny = h.y + DY[d];
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) {
      return fail({ x: h.x, y: h.y, d }, '現場の外に水が噴き出した！', '管の口が、現場の外を向いていた。');
    }
    const n = G.grid[ny][nx];
    const entry = OPP[d];
    if (n.type === 'house') {
      if (n.dir !== entry) return fail({ x: h.x, y: h.y, d }, '家の壁に水がぶつかった！', '家には「給水口」がある面からしか入らない。');
      if (!n.supplied) supply(n);
      if (G.state !== 'flow') return;
      continue;
    }
    if (n.type === 'empty') return fail({ x: h.x, y: h.y, d }, 'その先に管がない！', 'T字管の口がひとつ余っていないかもチェック。');
    if (n.type === 'rock') return fail({ x: h.x, y: h.y, d }, '岩盤にぶつかって水があふれた！', '岩盤の手前で曲げよう。');
    if (n.type === 'channel') return fail({ x: h.x, y: h.y, d }, '用水路に水が流れ込んだ！', '用水路はすき間から回り込もう。');
    if (n.type === 'source') return fail({ x: h.x, y: h.y, d }, '本管に逆流した！', '水は本管に戻せない。');
    if (!(n.mask & entry)) return fail({ x: h.x, y: h.y, d }, '管の向きが合わずに水漏れ！', '置いた管をもう一度タップすると回転できる。');
    const ch = n.mask === CROSS ? ((d === E || d === W) ? 'h' : 'v') : 'a';
    if (n.segs[ch]) continue; // すでに水が来ている管に合流
    const exits = exitsFor(n.mask, entry);
    n.segs[ch] = { entry, exits, t: 0, done: false, paths: waterPaths(n.mask, entry, exits) };
    next.push({ x: nx, y: ny, ch });
  }
}

function supply(house) {
  house.supplied = true;
  G.stats.houses++;
  const cx = (house.x + 0.5) * CELL, cy = (house.y + 0.5) * CELL;
  floater(cx, cy - CELL * 0.5, '給水OK！', '#86efac', 18);
  burst(cx, cy, 34, ['#22d3ee', '#a5f3fc', '#ffffff', '#86efac'], 5);
  SFX.house();
  buzz([20, 40, 20]);
  const st = STAGES[G.stageIdx];
  if (G.stats.houses >= st.houses.length) {
    G.state = 'clearing';
    G.doneAt = G.now;
    confetti();
    SFX.clear();
    syncButtons();
    updateHud();
  }
}

function fail(at, title, tip) {
  G.state = 'leaking';
  G.doneAt = G.now;
  G.leak = at ? { ...at, title, tip } : { title, tip };
  G.shake = 16;
  SFX.leak();
  buzz([60, 40, 140]);
  syncButtons();
}

/* ============================================================================
   採点
   ============================================================================ */
// 水が通ったまっすぐな直管が、何本続いているか（最長）
function longestStraight() {
  let best = 0;
  const wet = c => c && c.type === 'pipe' && c.part === 'straight' && Object.keys(c.segs).length > 0;
  for (const c of pipeCells()) {
    if (!wet(c)) continue;
    const [dx, dy] = c.mask === (E | W) ? [1, 0] : [0, 1];
    const prev = G.grid[c.y - dy] && G.grid[c.y - dy][c.x - dx];
    if (wet(prev) && prev.mask === c.mask) continue; // 区間の先頭からだけ数える
    let len = 0, x = c.x, y = c.y;
    while (y < ROWS && x < COLS && wet(G.grid[y][x]) && G.grid[y][x].mask === c.mask) {
      len++;
      x += dx;
      y += dy;
    }
    best = Math.max(best, len);
  }
  return best;
}

function scoreStage() {
  const st = STAGES[G.stageIdx];
  const cost = totalCost();
  const unused = pipeCells().filter(c => !Object.keys(c.segs).length).length;
  const bends = bendCount();
  const run = longestStraight();
  const list = [
    { key: 'bends', got: bends <= st.bends, note: `曲がり ${bends}回（目安 ${st.bends}回以内）` },
    { key: 'waste', got: unused === 0, note: `水の通らない管 ${unused}本` },
    { key: 'oneshot', got: G.fails === 0, note: `手戻り ${G.fails}回` },
    { key: 'straight', got: run >= 4, note: `直管の最長 ${run}本連続` }
  ];
  if (st.share) list.push({ key: 'share', got: G.firstSplit !== null && G.firstSplit >= st.share, note: `分岐の手前まで ${G.firstSplit ?? 0}本（目安 ${st.share}本以上）` });
  const bonusPts = list.filter(b => b.got).reduce((a, b) => a + BONUSES[b.key].pts, 0);
  const remain = st.budget - cost;
  const score = remain * 100 + st.houses.length * 1000 + bonusPts;
  const got = list.filter(b => b.got).length;
  const stars = 1 + (cost <= st.estimate ? 1 : 0) + (got >= 3 ? 1 : 0);
  return { cost, partsCost: partsCost(), remain, score, stars, list, got, bonusPts };
}

/* ============================================================================
   エフェクト
   ============================================================================ */
function floater(x, y, text, color, size) {
  G.floaters.push({ x, y, text, color, size, t0: G.now, dur: 900 });
}

function burst(x, y, n, colors, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random());
    G.particles.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5,
      g: 0.18, life: 1, decay: 0.02 + Math.random() * 0.015,
      size: 2 + Math.random() * 3, color: colors[i % colors.length], sq: false
    });
  }
}

function confetti() {
  const colors = ['#38bdf8', '#fbbf24', '#4ade80', '#f472b6', '#a78bfa', '#ffffff'];
  for (let i = 0; i < 90; i++) {
    G.particles.push({
      x: BW / 2 + (Math.random() - 0.5) * BW * 0.4, y: BH * 0.35,
      vx: (Math.random() - 0.5) * 9, vy: -4 - Math.random() * 7,
      g: 0.22, life: 1, decay: 0.008 + Math.random() * 0.008,
      size: 4 + Math.random() * 4, color: colors[i % colors.length], sq: true, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4
    });
  }
}

function sprayLeak() {
  const L = G.leak;
  if (!L || L.d === undefined) return;
  const px = (L.x + EDGE[L.d][0]) * CELL, py = (L.y + EDGE[L.d][1]) * CELL;
  const base = { [N]: [0, -1], [E]: [1, 0], [S]: [0, 1], [W]: [-1, 0] }[L.d];
  for (let i = 0; i < 4; i++) {
    const spread = (Math.random() - 0.5) * 1.6;
    const v = 3 + Math.random() * 3;
    G.particles.push({
      x: px, y: py,
      vx: (base[0] + (base[1] ? spread : 0)) * v, vy: (base[1] + (base[0] ? spread : 0)) * v - 1,
      g: 0.25, life: 1, decay: 0.03, size: 2 + Math.random() * 2.5,
      color: Math.random() < 0.5 ? '#22d3ee' : '#e0f2fe', sq: false
    });
  }
}

/* ============================================================================
   描画
   ============================================================================ */
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function layout() {
  const wrap = $('boardWrap');
  CELL = Math.max(30, Math.floor(Math.min(wrap.clientWidth / COLS, wrap.clientHeight / ROWS)));
  BW = CELL * COLS;
  BH = CELL * ROWS;
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  board.width = BW * DPR;
  board.height = BH * DPR;
  board.style.width = BW + 'px';
  board.style.height = BH + 'px';
  bg.width = BW * DPR;
  bg.height = BH * DPR;
  renderBg();
  renderPalette();
}

// 土の断面（背景は1回だけ描いておく）
function renderBg() {
  const c = bgctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = c.createLinearGradient(0, 0, 0, BH);
  g.addColorStop(0, '#4a3424');
  g.addColorStop(1, '#2a1c12');
  c.fillStyle = g;
  c.fillRect(0, 0, BW, BH);
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < (BW * BH) / 80; i++) {
    c.fillStyle = rnd() < 0.5 ? `rgba(255,214,170,${0.03 + rnd() * 0.07})` : `rgba(0,0,0,${0.05 + rnd() * 0.1})`;
    c.beginPath();
    c.arc(rnd() * BW, rnd() * BH, 0.5 + rnd() * 1.8, 0, Math.PI * 2);
    c.fill();
  }
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      c.fillStyle = (x + y) % 2 ? 'rgba(255,240,220,0.035)' : 'rgba(0,0,0,0.07)';
      rr(c, x * CELL + 2, y * CELL + 2, CELL - 4, CELL - 4, 6);
      c.fill();
    }
  }
}

function tracePipe(ctx, x, y, s, mask) {
  ctx.beginPath();
  if (isElbow(mask)) {
    const [a, b] = dirsOf(mask);
    const pts = arcPts(a, b);
    ctx.moveTo(x + pts[0][0] * s, y + pts[0][1] * s);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(x + pts[i][0] * s, y + pts[i][1] * s);
  } else {
    for (const d of dirsOf(mask)) {
      ctx.moveTo(x + s / 2, y + s / 2);
      ctx.lineTo(x + EDGE[d][0] * s, y + EDGE[d][1] * s);
    }
  }
}

function drawPipeBody(ctx, x, y, s, mask) {
  const steel = ctx.createLinearGradient(x, y, x + s, y + s);
  steel.addColorStop(0, '#dbe4ee');
  steel.addColorStop(1, '#6f8299');
  const layers = [[0.46, '#0a0f1a'], [0.36, steel], [0.2, '#0b1426']];
  const hub = !isElbow(mask) && !isStraight(mask) && dirsOf(mask).length > 1;
  ctx.lineCap = 'butt';
  ctx.lineJoin = 'round';
  for (const [w, col] of layers) {
    ctx.lineWidth = w * s;
    ctx.strokeStyle = col;
    tracePipe(ctx, x, y, s, mask);
    ctx.stroke();
    if (hub) {
      ctx.beginPath();
      ctx.arc(x + s / 2, y + s / 2, (w * s) / 2, 0, Math.PI * 2);
      ctx.fillStyle = col;
      ctx.fill();
    }
  }
  // 継手（フランジ）
  for (const d of dirsOf(mask)) {
    ctx.save();
    ctx.translate(x + EDGE[d][0] * s, y + EDGE[d][1] * s);
    ctx.rotate(ROT[d]);
    ctx.fillStyle = '#0a0f1a';
    ctx.fillRect(-s * 0.1, -s * 0.28, s * 0.1, s * 0.56);
    ctx.fillStyle = '#8796ab';
    ctx.fillRect(-s * 0.085, -s * 0.255, s * 0.07, s * 0.51);
    ctx.restore();
  }
}

function strokePolyline(ctx, pts, frac) {
  if (frac <= 0) return;
  const lens = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    lens.push(l);
    total += l;
  }
  let remain = total * Math.min(1, frac);
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    const l = lens[i - 1];
    if (remain >= l) {
      ctx.lineTo(pts[i][0], pts[i][1]);
      remain -= l;
    } else {
      const r = l ? remain / l : 0;
      ctx.lineTo(pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * r, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * r);
      break;
    }
  }
  ctx.stroke();
}

function drawWater(ctx, x, y, s, paths, t, ts) {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const p of paths) {
    const pts = p.map(([u, v]) => [x + u * s, y + v * s]);
    ctx.strokeStyle = '#22d3ee';
    ctx.lineWidth = s * 0.17;
    strokePolyline(ctx, pts, t);
    ctx.strokeStyle = 'rgba(230,252,255,0.8)';
    ctx.lineWidth = s * 0.05;
    ctx.setLineDash([s * 0.1, s * 0.18]);
    ctx.lineDashOffset = -ts * 0.06;
    strokePolyline(ctx, pts, t);
    ctx.setLineDash([]);
  }
}

function drawRock(ctx, x, y, s, gx, gy) {
  let seed = (gx * 7919 + gy * 104729 + 13) % 2147483647;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + rnd() * 0.4;
    const r = s * (0.3 + rnd() * 0.12);
    const px = x + s / 2 + Math.cos(a) * r, py = y + s / 2 + Math.sin(a) * r * 0.85 + s * 0.04;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  const g = ctx.createLinearGradient(x, y, x + s, y + s);
  g.addColorStop(0, '#a8a29e');
  g.addColorStop(1, '#3f3a36');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#1c1917';
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.beginPath();
  ctx.ellipse(x + s * 0.4, y + s * 0.36, s * 0.1, s * 0.05, -0.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawChannel(ctx, x, y, s, ts) {
  ctx.fillStyle = '#0b4266';
  ctx.fillRect(x, y + s * 0.08, s, s * 0.84);
  ctx.fillStyle = '#5b4636';
  ctx.fillRect(x, y + s * 0.04, s, s * 0.06);
  ctx.fillRect(x, y + s * 0.9, s, s * 0.06);
  ctx.strokeStyle = 'rgba(125,211,252,0.55)';
  ctx.lineWidth = 2;
  for (let k = 0; k < 3; k++) {
    ctx.beginPath();
    for (let i = 0; i <= 10; i++) {
      const px = x + (i / 10) * s;
      const py = y + s * (0.3 + k * 0.2) + Math.sin((x + px) * 0.12 + ts * 0.004 + k) * s * 0.035;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke();
  }
}

function drawSource(ctx, c, x, y, s, ts) {
  ctx.fillStyle = 'rgba(14,165,233,0.2)';
  rr(ctx, x + 3, y + 3, s - 6, s - 6, 8);
  ctx.fill();
  drawPipeBody(ctx, x, y, s, c.dir);
  if (c.segs.a) drawWater(ctx, x, y, s, c.segs.a.paths, c.segs.a.t, ts);
  const cx = x + s / 2, cy = y + s / 2;
  if (G.state === 'design' || G.state === 'intro') {
    const p = (ts % 1200) / 1200;
    ctx.strokeStyle = `rgba(56,189,248,${1 - p})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, s * (0.3 + p * 0.25), 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(cx, cy, s * 0.3, 0, Math.PI * 2);
  ctx.fillStyle = '#0284c7';
  ctx.fill();
  ctx.lineWidth = s * 0.06;
  ctx.strokeStyle = '#7dd3fc';
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = `900 ${Math.round(s * 0.21)}px 'M PLUS Rounded 1c', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('本管', cx, cy + 1);
}

function drawHouse(ctx, c, x, y, s, ts) {
  drawPipeBody(ctx, x, y, s, c.dir);
  if (c.supplied) drawWater(ctx, x, y, s, [[EDGE[c.dir], [0.5, 0.5]]], 1, ts);
  const cx = x + s / 2, cy = y + s * 0.56, w = s * 0.6;
  ctx.fillStyle = c.supplied ? '#fef9c3' : '#e2e8f0';
  rr(ctx, cx - w / 2, cy - w * 0.12, w, w * 0.56, 3);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx - w * 0.64, cy - w * 0.08);
  ctx.lineTo(cx, cy - w * 0.64);
  ctx.lineTo(cx + w * 0.64, cy - w * 0.08);
  ctx.closePath();
  ctx.fillStyle = '#f97316';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = '#7c2d12';
  ctx.stroke();
  ctx.fillStyle = '#7c2d12';
  ctx.fillRect(cx - w * 0.1, cy + w * 0.15, w * 0.2, w * 0.29);
  ctx.fillStyle = c.supplied ? '#facc15' : '#475569';
  ctx.fillRect(cx - w * 0.38, cy + w * 0.02, w * 0.18, w * 0.16);
  ctx.fillRect(cx + w * 0.2, cy + w * 0.02, w * 0.18, w * 0.16);
  if (c.supplied) {
    const bob = Math.sin(ts * 0.006) * 2;
    ctx.beginPath();
    ctx.arc(x + s * 0.82, y + s * 0.2 + bob, s * 0.15, 0, Math.PI * 2);
    ctx.fillStyle = '#22c55e';
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `900 ${Math.round(s * 0.15)}px 'M PLUS Rounded 1c', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('OK', x + s * 0.82, y + s * 0.2 + bob + 1);
  }
}

// 設計中：本管の出口と、前回漏れた場所を示す
function drawHints(ctx, ts) {
  if (G.state !== 'design' && G.state !== 'intro') return;
  const pulse = 0.5 + 0.5 * Math.sin(ts * 0.008);
  const marks = [];
  const s0 = STAGES[G.stageIdx].source;
  const sx = s0.x + DX[s0.dir], sy = s0.y + DY[s0.dir];
  if (!portInto(sx, sy, OPP[s0.dir]) || G.grid[sy][sx].type !== 'pipe') marks.push({ x: sx, y: sy, rgb: '250,204,21', label: ARROW[s0.dir] });
  if (G.leakMark) marks.push({ x: G.leakMark.x, y: G.leakMark.y, rgb: '244,63,94', label: '✕' });
  for (const m of marks) {
    if (m.x < 0 || m.y < 0 || m.x >= COLS || m.y >= ROWS) continue;
    rr(ctx, m.x * CELL + 3, m.y * CELL + 3, CELL - 6, CELL - 6, 8);
    ctx.fillStyle = `rgba(${m.rgb},${0.08 + 0.17 * pulse})`;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = `rgba(${m.rgb},${0.45 + 0.55 * pulse})`;
    ctx.stroke();
    if (G.grid[m.y][m.x].type === 'empty') {
      ctx.fillStyle = `rgba(${m.rgb},${0.7 + 0.3 * pulse})`;
      ctx.font = `900 ${Math.round(CELL * 0.42)}px 'M PLUS Rounded 1c', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(m.label, (m.x + 0.5) * CELL, (m.y + 0.5) * CELL);
    }
  }
}

const easeOutBack = k => 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2);

function draw(ts) {
  const ctx = bctx;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, BW, BH);
  ctx.save();
  if (G.shake > 0.3) ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
  ctx.drawImage(bg, 0, 0, BW, BH);
  if (G.grid) {
    for (const row of G.grid) {
      for (const c of row) {
        const x = c.x * CELL, y = c.y * CELL, s = CELL;
        if (c.type === 'rock') drawRock(ctx, x, y, s, c.x, c.y);
        else if (c.type === 'channel') drawChannel(ctx, x, y, s, ts);
      }
    }
    drawHints(ctx, ts);
    for (const row of G.grid) {
      for (const c of row) {
        const x = c.x * CELL, y = c.y * CELL, s = CELL;
        if (c.type === 'source') drawSource(ctx, c, x, y, s, ts);
        else if (c.type === 'house') drawHouse(ctx, c, x, y, s, ts);
        else if (c.type === 'pipe') {
          const kp = Math.min(1, (ts - c.placedAt) / 170);
          const kr = Math.min(1, (ts - c.rotAt) / 140);
          const sc = kp < 1 ? 0.55 + 0.45 * easeOutBack(kp) : 1;
          const rot = kr < 1 ? -(1 - kr) * Math.PI / 2 : 0;
          ctx.save();
          if (sc !== 1 || rot) {
            ctx.translate(x + s / 2, y + s / 2);
            ctx.rotate(rot);
            ctx.scale(sc, sc);
            ctx.translate(-(x + s / 2), -(y + s / 2));
          }
          drawPipeBody(ctx, x, y, s, c.mask);
          for (const ch in c.segs) drawWater(ctx, x, y, s, c.segs[ch].paths, c.segs[ch].t, ts);
          ctx.restore();
        }
      }
    }
  }
  for (const p of G.particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    if (p.sq) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const f of G.floaters) {
    const k = (ts - f.t0) / f.dur;
    if (k < 0 || k > 1) continue;
    ctx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
    ctx.font = `900 ${f.size}px 'M PLUS Rounded 1c', sans-serif`;
    const fx = Math.min(BW - 40, Math.max(40, f.x)), fy = f.y - k * 30;
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.75)';
    ctx.strokeText(f.text, fx, fy);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, fx, fy);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function renderPalette() {
  const icons = { straight: E | W, elbow: E | S, tee: E | S | W, cross: CROSS };
  document.querySelectorAll('.part').forEach(btn => {
    const cv = btn.querySelector('canvas');
    const size = 34;
    cv.width = size * DPR;
    cv.height = size * DPR;
    const ctx = cv.getContext('2d');
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#2a1c12';
    rr(ctx, 0, 0, size, size, 7);
    ctx.fill();
    const m = icons[btn.dataset.tool];
    if (m) {
      drawPipeBody(ctx, 0, 0, size, m);
    } else {
      ctx.fillStyle = '#e2e8f0';
      ctx.font = `900 20px 'M PLUS Rounded 1c', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⛏', size / 2, size / 2 + 1);
    }
  });
}

function updateHud() {
  if (!G.grid) return;
  const st = STAGES[G.stageIdx];
  const cost = totalCost();
  const bar = $('costbar');
  $('costFill').style.width = `${Math.min(100, (cost / st.budget) * 100)}%`;
  $('estMark').style.left = `${(st.estimate / st.budget) * 100}%`;
  bar.classList.toggle('over-est', cost > st.estimate && cost <= st.budget);
  bar.classList.toggle('over-budget', cost > st.budget);
  $('costText').textContent = cost > st.budget
    ? `施工費 ${cost}万 / 予算 ${st.budget}万　予算オーバー！`
    : `施工費 ${cost}万 / 予算 ${st.budget}万`;
  $('estText').textContent = `${st.estimate}万`;
  const bends = bendCount();
  $('bendText').textContent = `${bends}/${st.bends}`;
  $('bendChip').className = bends <= st.bends ? 'good' : 'bad';
  $('failText').textContent = `${G.fails}回`;
  $('failChip').className = G.fails ? 'bad' : '';
}

function syncButtons() {
  const b = $('actionBtn');
  const design = G.state === 'design';
  b.disabled = !design;
  b.textContent = G.state === 'flow' ? '💧 通水中…' : '💧 通水テスト';

  document.querySelectorAll('.part').forEach(p => { p.disabled = !design; });
}

        <div><span>残った予算 ${st.budget}−${r.cost}＝${r.remain}万</span><span>+${(r.remain * 100).toLocaleString()}</span></div>
        <div><span>給水 ×${st.houses.length}</span><span>+${(st.houses.length * 1000).toLocaleString()}</span></div>
        <div><span>職人ボーナス ×${r.got}</span><span>+${r.bonusPts.toLocaleString()}</span></div>
        <div class="total"><span>ステージ得点</span><span>${r.score.toLocaleString()}</span></div>
      </div>
      <div class="bonus">
        ${r.list.map(b => `<div class="${b.got ? 'got' : 'miss'}"><div class="head"><span>${b.got ? '✓' : '✕'} ${BONUSES[b.key].name}</span><span>${b.got ? '+' + BONUSES[b.key].pts : '—'}</span></div><small>${b.note}。${BONUSES[b.key].why}</small></div>`).join('')}
      </div>
      <div class="memo"><b>🔧 松下社長の現場メモ</b><p>${MEMOS[G.stageIdx]}</p></div>
      <div class="row2">
        <button class="btn btn-ghost" data-act="retry">↺ もう一回</button>
        <button class="btn btn-amber" data-act="next">${last ? '🏆 結果を見る' : '次のステージ ▶'}</button>
      </div>
    </div>`);
}

function showFail() {
  const L = G.leak;
  showOverlay(`
    <div class="card fail">
      <div class="big-emoji">💦</div>
      <h2>${L.title}</h2>
      <p>${L.tip}</p>
      <p style="font-size:12px;color:#8ea0bd">漏れた場所に<b style="color:#fb7185">✕</b>が付きます。管はそのまま残るので、直して再テストしよう。<br>再テストには手戻り費 <b style="color:#fbbf24">+${REWORK_COST}万</b> がかかります。</p>
      <div class="row2">
        <button class="btn btn-ghost" data-act="retry">最初から</button>
        <button class="btn btn-primary" data-act="fix">🔧 直す</button>
      </div>
    </div>`);
}

function rankTitle(stars) {
  if (stars >= 14) return '松下社長級の名職人';
  if (stars >= 10) return '頼れる職人';
  if (stars >= 6) return '一人前の配管工';
  return '見習い配管工';
}

function showFinal() {
  G.state = 'result';
  syncButtons();
  const total = G.results.reduce((a, r) => a + (r ? r.score : 0), 0);
  const stars = G.results.reduce((a, r) => a + (r ? r.stars : 0), 0);
  const title = rankTitle(stars);
  const best = loadBest();
  const isBest = total > best;
  if (isBest) saveBest(total);
  G.share = { total, title };
  showOverlay(`
    <div class="card">
      <span class="tag">ALL CLEAR!</span>
      <div class="big-emoji" style="margin-top:8px">🏆</div>
      <div class="total-score">${total.toLocaleString()}<small style="font-size:18px">点</small></div>
      <div style="font-size:13px;color:#8ea0bd">★ ${stars} / ${STAGES.length * 3}${isBest ? '　<b style="color:#fde047">ベスト更新！</b>' : `　ベスト ${best.toLocaleString()}点`}</div>
      <div class="rank-title">称号：${title}</div>
      <div class="share-label">結果をシェア</div>
      <div class="row2">
        <button class="btn btn-x" data-act="share-x">𝕏 でポスト</button>
        <button class="btn btn-line" data-act="share-line">LINEで送る</button>
      </div>
      <div class="recruit">
        <b>🔧 この仕事、本物は松下工業で。</b>
        <p>地面の下や壁の向こうで、街のライフラインを守るのが配管工。未経験から一生モノの技術を身につけませんか？</p>
        ${RECRUIT_URL ? `<a class="btn btn-amber" style="display:block;text-decoration:none" href="${RECRUIT_URL}" target="_blank" rel="noopener">求人を見る ▶</a>` : ''}
      </div>
      <button class="btn btn-primary" data-act="title">もう一度あそぶ</button>
    </div>`);
}

function shareText() {
  const { total, title } = G.share;
  return `快感！配管クラフトで${total.toLocaleString()}点！称号は「${title}」でした💧 #配管クラフト #松下工業`;
}

overlay.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  ac();
  const act = btn.dataset.act;
  if (act === 'start') {
    G.results = [];
    startStage(0, false);
  } else if (act === 'go') {
    hideOverlay();
    G.state = 'design';
    syncButtons();
    updateHud();
  } else if (act === 'fix') {
    // 管は残したまま水だけ抜いて設計に戻る。手戻りは1回分加算
    G.fails++;
    G.leakMark = G.leak && G.leak.d !== undefined ? { x: G.leak.x + DX[G.leak.d], y: G.leak.y + DY[G.leak.d] } : null;
    resetWater();
    G.particles = [];
    hideOverlay();
    G.state = 'design';
    syncButtons();
    updateHud();
  } else if (act === 'retry') {
    startStage(G.stageIdx, true);
  } else if (act === 'next') {
    if (G.stageIdx < STAGES.length - 1) startStage(G.stageIdx + 1, false);
    else showFinal();
  } else if (act === 'title') {
    showTitle();
  } else if (act === 'share-x') {
    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(SITE_URL)}`, '_blank', 'noopener');
  } else if (act === 'share-line') {
    window.open(`https://line.me/R/share?text=${encodeURIComponent(shareText() + '\n' + SITE_URL)}`, '_blank', 'noopener');
  }
});

board.addEventListener('pointerdown', e => {
  ac();
  const r = board.getBoundingClientRect();
  const x = Math.floor(((e.clientX - r.left) / r.width) * COLS);
  const y = Math.floor(((e.clientY - r.top) / r.height) * ROWS);
  if (x >= 0 && y >= 0 && x < COLS && y < ROWS) placeAt(x, y);
});

$('palette').addEventListener('click', e => {
  const btn = e.target.closest('.part');
  if (btn && !btn.disabled) selectTool(btn.dataset.tool);
});

$('actionBtn').addEventListener('click', () => {
  ac();
  startTest();
});

$('clearBtn').addEventListener('click', clearAll);

$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) SFX.place();
});

/* ============================================================================
   メインループ
   ============================================================================ */
let lastTs = performance.now();

function update(dt) {
  if (G.state === 'flow') {
    stepFlow(dt);
  } else if (G.state === 'leaking') {
    if (G.now - G.doneAt < 1200) sprayLeak();
    else if (!overlay.classList.contains('show')) showFail();
  } else if (G.state === 'clearing') {
    if (G.now - G.doneAt > 1300 && !overlay.classList.contains('show')) finishStage();
  }

  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.g;
    if (p.rot !== undefined) p.rot += p.vr;
    p.life -= p.decay;
    if (p.life <= 0) G.particles.splice(i, 1);
  }
  G.floaters = G.floaters.filter(f => G.now - f.t0 < f.dur);
  G.shake *= 0.88;
}

function frame(ts) {
  const dt = Math.min(50, ts - lastTs);
  lastTs = ts;
  G.now = ts;
  update(dt);
  draw(ts);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', layout);
layout();
showTitle();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderPalette);
requestAnimationFrame(frame);
</script>
</body>
