<script>
'use strict';

/* ============================================================================
   設定
   ============================================================================ */
// 求人ページ（怪人など）のURLを入れると、最終結果画面に「求人を見る」ボタンが出る
const RECRUIT_URL = '';
const SITE_URL = 'https://matsushita-pipe-craft.pages.dev/';

const COLS = 7, ROWS = 9;
const N = 1, E = 2, S = 4, W = 8;
const DIRS = [N, E, S, W];
const DX = { [N]: 0, [E]: 1, [S]: 0, [W]: -1 };
const DY = { [N]: -1, [E]: 0, [S]: 1, [W]: 0 };
const OPP = { [N]: S, [E]: W, [S]: N, [W]: E };
const EDGE = { [N]: [0.5, 0], [E]: [1, 0.5], [S]: [0.5, 1], [W]: [0, 0.5] };
const ROT = { [N]: -Math.PI / 2, [E]: 0, [S]: Math.PI / 2, [W]: Math.PI };
const ARROW = { [N]: '↑', [E]: '→', [S]: '↓', [W]: '←' };
const CROSS = 15;

// house.dir = 家のどの面に給水口があるか / source.dir = 本管から水が出る向き
const STAGES = [
  {
    name: 'はじめての引き込み',
    sub: '道路の本管から、新築の家まで水を引き込もう。',
    countdown: 22, flowMs: 1800, goal: 12, tees: false,
    source: { x: 0, y: 1, dir: E },
    houses: [{ x: 6, y: 7, dir: W }],
    rocks: [], channel: []
  },
  {
    name: '用水路を越えろ',
    sub: 'まっすぐ下は用水路。端のすき間から回り込め！',
    countdown: 25, flowMs: 1600, goal: 15, tees: false,
    source: { x: 3, y: 0, dir: S },
    houses: [{ x: 3, y: 8, dir: N }],
    rocks: [], channel: [[1, 4], [2, 4], [3, 4], [4, 4], [5, 4]]
  },
  {
    name: '2軒同時に給水',
    sub: 'T字管で水を分けて、左右の家に届けよう。',
    countdown: 26, flowMs: 1600, goal: 16, tees: true,
    source: { x: 3, y: 0, dir: S },
    houses: [{ x: 0, y: 8, dir: N }, { x: 6, y: 8, dir: N }],
    rocks: [[3, 5]], channel: []
  },
  {
    name: '岩盤だらけの現場',
    sub: '掘れない岩盤をよけて、上と下の2軒へ。',
    countdown: 24, flowMs: 1450, goal: 18, tees: true,
    source: { x: 0, y: 4, dir: E },
    houses: [{ x: 6, y: 0, dir: S }, { x: 6, y: 8, dir: N }],
    rocks: [[2, 2], [2, 6], [4, 1], [4, 4], [4, 7], [5, 3], [1, 7]], channel: []
  },
  {
    name: '100m 長距離バトル',
    sub: '用水路と岩盤を越えて、3軒すべてに給水せよ！',
    countdown: 28, flowMs: 1350, goal: 22, tees: true,
    source: { x: 0, y: 0, dir: S },
    houses: [{ x: 6, y: 2, dir: W }, { x: 6, y: 8, dir: W }, { x: 0, y: 8, dir: N }],
    rocks: [[2, 1], [5, 5], [1, 5]], channel: [[3, 2], [3, 3], [3, 5], [3, 6]]
  }
];

const MEMOS = [
  '公道の下の水道管は、深さ1.2m前後に埋めるのが基本。浅く埋めれば安く済むけど、道路管理者の許可が下りない。決まりを守るのもプロの技術。',
  '用水路を越えるときは、直角（90°）より45°曲げ。曲がりがゆるいほど水圧が落ちにくい。少し高くても、住んでから困らない方を選ぶ。',
  '家が2軒になれば、必要な水の量も増える。「ギリギリ足りる」設計だと、隣に家が建った途端に水が出なくなる。だから口径はワンサイズ余裕を持たせる。',
  '100m先まで送るなら、最初は太い管（φ40）で走って、25→20と段階的に絞る。細い管だけで引っ張ると、摩擦で水が出なくなる。',
  '水が出ないからと増圧ポンプで無理に押すと、細い管が破裂して大損害。ポンプに頼らず、管の太さと道すじの設計で解決するのが職人。'
];

/* ============================================================================
   管の形
   ============================================================================ */
const dirsOf = m => DIRS.filter(d => m & d);
const isElbow = m => m === (N | E) || m === (E | S) || m === (S | W) || m === (W | N);
const isStraight = m => m === (N | S) || m === (E | W);

// 角管の水路：2辺の中点を、共有する角を中心とした1/4円でつなぐ
function arcPts(a, b) {
  const m = a | b;
  const cx = (m & E) ? 1 : 0, cy = (m & N) ? 0 : 1;
  const pa = EDGE[a], pb = EDGE[b];
  const a0 = Math.atan2(pa[1] - cy, pa[0] - cx);
  let d = Math.atan2(pb[1] - cy, pb[0] - cx) - a0;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  const pts = [];
  for (let i = 0; i <= 12; i++) {
    const t = a0 + d * i / 12;
    pts.push([cx + 0.5 * Math.cos(t), cy + 0.5 * Math.sin(t)]);
  }
  return pts;
}

// 入口から見た出口（十字管はまっすぐ抜けるだけ、T字管は2方向に分かれる）
function exitsFor(mask, entry) {
  if (mask === CROSS) return [OPP[entry]];
  return dirsOf(mask).filter(d => d !== entry);
}

// 水の通り道（マス内 0〜1 座標の折れ線）
function waterPaths(mask, entry, exits) {
  if (entry === null) return exits.map(d => [[0.5, 0.5], EDGE[d]]);
  if (isElbow(mask)) return [arcPts(entry, exits[0])];
  return exits.map(d => [EDGE[entry], [0.5, 0.5], EDGE[d]]);
}

function randomPiece(stage) {
  const table = [
    [E | W, 3], [N | S, 3],
    [N | E, 2.6], [E | S, 2.6], [S | W, 2.6], [W | N, 2.6],
    [CROSS, 1.1]
  ];
  if (stage.tees) table.push([N | E | S, 1.3], [E | S | W, 1.3], [S | W | N, 1.3], [W | N | E, 1.3]);
  const total = table.reduce((a, [, w]) => a + w, 0);
  let r = Math.random() * total;
  for (const [m, w] of table) {
    if ((r -= w) < 0) return m;
  }
  return E | W;
}

/* ============================================================================
   効果音（Web Audio のシンセ。音声ファイル不要）
   ============================================================================ */
let audioCtx = null;
let soundOn = true;

function ac() {
  if (!audioCtx) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (C) audioCtx = new C();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone(freq, dur, { type = 'sine', vol = 0.2, to = null, delay = 0 } = {}) {
  if (!soundOn) return;
  const a = ac();
  if (!a) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g);
  g.connect(a.destination);
  o.start(t);
  o.stop(t + dur + 0.02);
}

function noise(dur, { freq = 800, type = 'lowpass', vol = 0.3, delay = 0 } = {}) {
  if (!soundOn) return;
  const a = ac();
  if (!a) return;
  const t = a.currentTime + delay;
  const len = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource();
  src.buffer = buf;
  const f = a.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f);
  f.connect(g);
  g.connect(a.destination);
  src.start(t);
}

const PENTA = [0, 2, 4, 7, 9];
const SFX = {
  place() { tone(520, 0.08, { to: 840, vol: 0.16 }); },
  deny() { tone(150, 0.12, { type: 'square', vol: 0.05 }); },
  replace() { noise(0.18, { freq: 700, vol: 0.22 }); tone(300, 0.12, { to: 120, type: 'triangle', vol: 0.12 }); },
  // 管が1本満たされるたびに音階が上がっていく
  tick(n) {
    const step = n % 15;
    const semi = Math.floor(step / 5) * 12 + PENTA[step % 5];
    tone(330 * Math.pow(2, semi / 12), 0.1, { type: 'triangle', vol: 0.12 });
  },
  split() { tone(660, 0.12, { to: 990, type: 'sine', vol: 0.12 }); },
  cross() { [880, 1320].forEach((f, i) => tone(f, 0.14, { type: 'square', vol: 0.05, delay: i * 0.06 })); },
  house() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.28, { vol: 0.15, delay: i * 0.07 })); },
  leak() { noise(0.8, { freq: 500, vol: 0.5 }); tone(150, 0.5, { to: 45, type: 'sawtooth', vol: 0.1 }); },
  clear() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.32, { type: 'triangle', vol: 0.16, delay: i * 0.09 })); },
  start() { noise(0.7, { freq: 1100, type: 'bandpass', vol: 0.3 }); tone(220, 0.35, { to: 440, vol: 0.08 }); },
  beep() { tone(880, 0.08, { type: 'square', vol: 0.05 }); }
};

function buzz(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* 非対応端末 */ }
}

/* ============================================================================
   ゲーム状態
   ============================================================================ */
const $ = id => document.getElementById(id);
const board = $('board');
const bctx = board.getContext('2d');
const bg = document.createElement('canvas');
const bgctx = bg.getContext('2d');
let DPR = 1, CELL = 48, BW = CELL * COLS, BH = CELL * ROWS;

const G = {
  state: 'title',   // title / intro / build / flow / leaking / clearing / result
  stageIdx: 0,
  grid: null,
  queue: [],
  heads: [],
  countdown: 0,
  fast: false,
  score: 0,
  stats: null,
  leak: null,
  doneAt: 0,
  shake: 0,
  lastBeep: 0,
  results: [],
  particles: [],
  floaters: [],
  now: 0
};

function buildStage(i) {
  const st = STAGES[i];
  G.stageIdx = i;
  G.grid = Array.from({ length: ROWS }, (_, y) =>
    Array.from({ length: COLS }, (_, x) => ({ x, y, type: 'empty', mask: 0, segs: {}, placedAt: 0, cool: 0 })));
  st.rocks.forEach(([x, y]) => { G.grid[y][x].type = 'rock'; });
  st.channel.forEach(([x, y]) => { G.grid[y][x].type = 'channel'; });
  const src = G.grid[st.source.y][st.source.x];
  src.type = 'source';
  src.dir = st.source.dir;
  st.houses.forEach(h => {
    const c = G.grid[h.y][h.x];
    c.type = 'house';
    c.dir = h.dir;
    c.supplied = false;
  });
  G.queue = Array.from({ length: 5 }, () => randomPiece(st));
  G.heads = [];
  G.countdown = st.countdown;
  G.fast = false;
  G.score = 0;
  G.stats = { pipes: 0, cross: 0, houses: 0, early: 0, replaced: 0 };
  G.leak = null;
  G.lastBeep = 0;
  G.particles = [];
  G.floaters = [];
  $('stageTag').textContent = `STAGE ${i + 1}/${STAGES.length}`;
  $('stageName').textContent = st.name;
  renderQueue();
  updateHud();
}

function startStage(i, skipIntro) {
  buildStage(i);
  if (skipIntro) {
    hideOverlay();
    G.state = 'build';
  } else {
    G.state = 'intro';
    showIntro();
  }
  syncButtons();
}

/* ============================================================================
   操作
   ============================================================================ */
function placeAt(x, y) {
  if (G.state !== 'build' && G.state !== 'flow') return;
  const c = G.grid[y][x];
  const cx = (x + 0.5) * CELL, cy = (y + 0.5) * CELL;
  if (c.type === 'rock' || c.type === 'channel' || c.type === 'source' || c.type === 'house') {
    SFX.deny();
    floater(cx, cy, c.type === 'rock' ? '岩盤は掘れない！' : c.type === 'channel' ? '用水路には置けない！' : 'ここには置けない', '#fda4af', 13);
    return;
  }
  if (c.type === 'pipe') {
    if (Object.keys(c.segs).length) {
      SFX.deny();
      floater(cx, cy, '水が入った管は外せない！', '#fda4af', 13);
      return;
    }
    if (G.now < c.cool) return;
    G.stats.replaced++;
    G.score = Math.max(0, G.score - 50);
    floater(cx, cy, '置き直し -50', '#fb7185', 14);
    burst(cx, cy, 14, ['#a16207', '#78350f', '#d6d3d1'], 3.5);
    SFX.replace();
  } else {
    SFX.place();
  }
  c.type = 'pipe';
  c.mask = G.queue.shift();
  c.segs = {};
  c.placedAt = G.now;
  c.cool = G.now + 260;
  G.queue.push(randomPiece(STAGES[G.stageIdx]));
  buzz(8);
  renderQueue();
  updateHud();
}

function startFlow(early) {
  if (G.state !== 'build') return;
  if (early && G.countdown > 0.5) {
    const bonus = Math.ceil(G.countdown) * 20;
    G.stats.early = bonus;
    G.score += bonus;
    floater(BW / 2, BH * 0.15, `早出しボーナス +${bonus}`, '#fde047', 18);
  }
  G.countdown = 0;
  G.state = 'flow';
  const st = STAGES[G.stageIdx];
  const src = G.grid[st.source.y][st.source.x];
  src.segs.a = { entry: null, exits: [src.dir], t: 0, done: false, paths: waterPaths(0, null, [src.dir]) };
  G.heads = [{ x: src.x, y: src.y, ch: 'a' }];
  SFX.start();
  buzz(30);
  syncButtons();
  updateHud();
}

/* ============================================================================
   水の流れ
   ============================================================================ */
function stepFlow(dt) {
  const st = STAGES[G.stageIdx];
  // 管がつながるほど、少しずつ流れが速くなる
  const ms = G.fast ? 110 : st.flowMs * Math.max(0.62, 1 - G.stats.pipes * 0.012);
  const next = [];
  for (const h of G.heads) {
    const seg = G.grid[h.y][h.x].segs[h.ch];
    seg.t += dt / ms;
    if (seg.t < 1) {
      next.push(h);
      continue;
    }
    seg.t = 1;
    seg.done = true;
    onSegDone(h, seg, next);
    if (G.state !== 'flow') return;
  }
  G.heads = next;
  if (G.heads.length === 0) {
    fail(null, '水が家まで届かなかった…', '管どうしが合流して行き止まりに。');
  }
}

function onSegDone(h, seg, next) {
  const cell = G.grid[h.y][h.x];
  const cx = (h.x + 0.5) * CELL, cy = (h.y + 0.5) * CELL;

  if (cell.type === 'pipe') {
    G.stats.pipes++;
    G.score += 100;
    SFX.tick(G.stats.pipes);
    floater(cx, cy, '+100', '#a5f3fc', 13);
    if (cell.mask === CROSS && cell.segs.h && cell.segs.v && cell.segs.h.done && cell.segs.v.done) {
      G.stats.cross++;
      G.score += 400;
      SFX.cross();
      floater(cx, cy - CELL * 0.4, 'クロス通水！ +400', '#f0abfc', 16);
      burst(cx, cy, 18, ['#f0abfc', '#a5f3fc', '#fff'], 4);
    }
    if (seg.exits.length === 2) {
      SFX.split();
      floater(cx, cy - CELL * 0.4, '分岐！', '#fde047', 15);
    }
    updateHud();
  }

  for (const d of seg.exits) {
    const nx = h.x + DX[d], ny = h.y + DY[d];
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) {
      return fail({ x: h.x, y: h.y, d }, '現場の外に水が噴き出した！', '水の行き先を、先回りしてふさごう。');
    }
    const n = G.grid[ny][nx];
    const entry = OPP[d];
    if (n.type === 'house') {
      if (n.dir !== entry) return fail({ x: h.x, y: h.y, d }, '家の壁に水がぶつかった！', '家には「給水口」がある面からしか入らない。');
      if (!n.supplied) supply(n);
      if (G.state !== 'flow') return;
      continue;
    }
    if (n.type === 'empty') return fail({ x: h.x, y: h.y, d }, 'その先に管がない！', '赤く光るマスが、水が次に向かう場所。');
    if (n.type === 'rock') return fail({ x: h.x, y: h.y, d }, '岩盤にぶつかって水があふれた！', '岩盤の手前で曲げよう。');
    if (n.type === 'channel') return fail({ x: h.x, y: h.y, d }, '用水路に水が流れ込んだ！', '用水路はすき間から回り込もう。');
    if (n.type === 'source') return fail({ x: h.x, y: h.y, d }, '本管に逆流した！', '水は本管に戻せない。');
    if (!(n.mask & entry)) return fail({ x: h.x, y: h.y, d }, '管の向きが合わずに水漏れ！', '次の管の口が、水の来る向きと合っているか確認。');
    const ch = n.mask === CROSS ? ((d === E || d === W) ? 'h' : 'v') : 'a';
    if (n.segs[ch]) continue; // すでに水が来ている管に合流
    const exits = exitsFor(n.mask, entry);
    n.segs[ch] = { entry, exits, t: 0, done: false, paths: waterPaths(n.mask, entry, exits) };
    next.push({ x: nx, y: ny, ch });
  }
}

function supply(house) {
  house.supplied = true;
  G.stats.houses++;
  G.score += 1000;
  const cx = (house.x + 0.5) * CELL, cy = (house.y + 0.5) * CELL;
  floater(cx, cy - CELL * 0.5, '給水OK！ +1000', '#86efac', 18);
  burst(cx, cy, 34, ['#22d3ee', '#a5f3fc', '#ffffff', '#86efac'], 5);
  SFX.house();
  buzz([20, 40, 20]);
  updateHud();
  const st = STAGES[G.stageIdx];
  if (G.stats.houses >= st.houses.length) {
    G.state = 'clearing';
    G.doneAt = G.now;
    confetti();
    SFX.clear();
    syncButtons();
  }
}

function fail(at, title, tip) {
  G.state = 'leaking';
  G.doneAt = G.now;
  G.leak = at ? { ...at, title, tip } : { title, tip };
  G.shake = 16;
  SFX.leak();
  buzz([60, 40, 140]);
  syncButtons();
}

/* ============================================================================
   エフェクト
   ============================================================================ */
function floater(x, y, text, color, size) {
  G.floaters.push({ x, y, text, color, size, t0: G.now, dur: 900 });
}

function burst(x, y, n, colors, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random());
    G.particles.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5,
      g: 0.18, life: 1, decay: 0.02 + Math.random() * 0.015,
      size: 2 + Math.random() * 3, color: colors[i % colors.length], sq: false
    });
  }
}

function confetti() {
  const colors = ['#38bdf8', '#fbbf24', '#4ade80', '#f472b6', '#a78bfa', '#ffffff'];
  for (let i = 0; i < 90; i++) {
    G.particles.push({
      x: BW / 2 + (Math.random() - 0.5) * BW * 0.4, y: BH * 0.35,
      vx: (Math.random() - 0.5) * 9, vy: -4 - Math.random() * 7,
      g: 0.22, life: 1, decay: 0.008 + Math.random() * 0.008,
      size: 4 + Math.random() * 4, color: colors[i % colors.length], sq: true, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4
    });
  }
}

function sprayLeak() {
  const L = G.leak;
  if (!L || L.d === undefined) return;
  const px = (L.x + EDGE[L.d][0]) * CELL, py = (L.y + EDGE[L.d][1]) * CELL;
  for (let i = 0; i < 4; i++) {
    const spread = (Math.random() - 0.5) * 1.6;
    const base = { [N]: [0, -1], [E]: [1, 0], [S]: [0, 1], [W]: [-1, 0] }[L.d];
    const v = 3 + Math.random() * 3;
    G.particles.push({
      x: px, y: py,
      vx: (base[0] + (base[1] ? spread : 0)) * v, vy: (base[1] + (base[0] ? spread : 0)) * v - 1,
      g: 0.25, life: 1, decay: 0.03, size: 2 + Math.random() * 2.5,
      color: Math.random() < 0.5 ? '#22d3ee' : '#e0f2fe', sq: false
    });
  }
}

/* ============================================================================
   描画
   ============================================================================ */
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function layout() {
  const wrap = $('boardWrap');
  CELL = Math.max(30, Math.floor(Math.min(wrap.clientWidth / COLS, wrap.clientHeight / ROWS)));
  BW = CELL * COLS;
  BH = CELL * ROWS;
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  board.width = BW * DPR;
  board.height = BH * DPR;
  board.style.width = BW + 'px';
  board.style.height = BH + 'px';
  bg.width = BW * DPR;
  bg.height = BH * DPR;
  renderBg();
  ['q0', 'q1', 'q2', 'q3'].forEach(id => {
    const cv = $(id);
    const size = id === 'q0' ? 58 : 36;
    cv.width = size * DPR;
    cv.height = size * DPR;
  });
  renderQueue();
}

// 土の断面（背景は1回だけ描いておく）
function renderBg() {
  const c = bgctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = c.createLinearGradient(0, 0, 0, BH);
  g.addColorStop(0, '#4a3424');
  g.addColorStop(1, '#2a1c12');
  c.fillStyle = g;
  c.fillRect(0, 0, BW, BH);
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < (BW * BH) / 80; i++) {
    c.fillStyle = rnd() < 0.5 ? `rgba(255,214,170,${0.03 + rnd() * 0.07})` : `rgba(0,0,0,${0.05 + rnd() * 0.1})`;
    c.beginPath();
    c.arc(rnd() * BW, rnd() * BH, 0.5 + rnd() * 1.8, 0, Math.PI * 2);
    c.fill();
  }
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      c.fillStyle = (x + y) % 2 ? 'rgba(255,240,220,0.035)' : 'rgba(0,0,0,0.07)';
      rr(c, x * CELL + 2, y * CELL + 2, CELL - 4, CELL - 4, 6);
      c.fill();
    }
  }
}

function tracePipe(ctx, x, y, s, mask) {
  ctx.beginPath();
  if (isElbow(mask)) {
    const [a, b] = dirsOf(mask);
    const pts = arcPts(a, b);
    ctx.moveTo(x + pts[0][0] * s, y + pts[0][1] * s);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(x + pts[i][0] * s, y + pts[i][1] * s);
  } else {
    for (const d of dirsOf(mask)) {
      ctx.moveTo(x + s / 2, y + s / 2);
      ctx.lineTo(x + EDGE[d][0] * s, y + EDGE[d][1] * s);
    }
  }
}

function drawPipeBody(ctx, x, y, s, mask) {
  const steel = ctx.createLinearGradient(x, y, x + s, y + s);
  steel.addColorStop(0, '#dbe4ee');
  steel.addColorStop(1, '#6f8299');
  const layers = [[0.46, '#0a0f1a'], [0.36, steel], [0.2, '#0b1426']];
  const hub = !isElbow(mask) && !isStraight(mask) && dirsOf(mask).length > 1;
  ctx.lineCap = 'butt';
  ctx.lineJoin = 'round';
  for (const [w, col] of layers) {
    ctx.lineWidth = w * s;
    ctx.strokeStyle = col;
    tracePipe(ctx, x, y, s, mask);
    ctx.stroke();
    if (hub) {
      ctx.beginPath();
      ctx.arc(x + s / 2, y + s / 2, (w * s) / 2, 0, Math.PI * 2);
      ctx.fillStyle = col;
      ctx.fill();
    }
  }
  // 継手（フランジ）
  for (const d of dirsOf(mask)) {
    ctx.save();
    ctx.translate(x + EDGE[d][0] * s, y + EDGE[d][1] * s);
    ctx.rotate(ROT[d]);
    ctx.fillStyle = '#0a0f1a';
    ctx.fillRect(-s * 0.1, -s * 0.28, s * 0.1, s * 0.56);
    ctx.fillStyle = '#8796ab';
    ctx.fillRect(-s * 0.085, -s * 0.255, s * 0.07, s * 0.51);
    ctx.restore();
  }
}

function strokePolyline(ctx, pts, frac) {
  if (frac <= 0) return;
  const lens = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    lens.push(l);
    total += l;
  }
  let remain = total * Math.min(1, frac);
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    const l = lens[i - 1];
    if (remain >= l) {
      ctx.lineTo(pts[i][0], pts[i][1]);
      remain -= l;
    } else {
      const r = l ? remain / l : 0;
      ctx.lineTo(pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * r, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * r);
      break;
    }
  }
  ctx.stroke();
}

function drawWater(ctx, x, y, s, paths, t, ts) {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const p of paths) {
    const pts = p.map(([u, v]) => [x + u * s, y + v * s]);
    ctx.strokeStyle = '#22d3ee';
    ctx.lineWidth = s * 0.17;
    strokePolyline(ctx, pts, t);
    ctx.strokeStyle = 'rgba(230,252,255,0.8)';
    ctx.lineWidth = s * 0.05;
    ctx.setLineDash([s * 0.1, s * 0.18]);
    ctx.lineDashOffset = -ts * 0.06;
    strokePolyline(ctx, pts, t);
    ctx.setLineDash([]);
  }
}

function drawRock(ctx, x, y, s, gx, gy) {
  let seed = (gx * 7919 + gy * 104729 + 13) % 2147483647;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + rnd() * 0.4;
    const r = s * (0.3 + rnd() * 0.12);
    const px = x + s / 2 + Math.cos(a) * r, py = y + s / 2 + Math.sin(a) * r * 0.85 + s * 0.04;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  const g = ctx.createLinearGradient(x, y, x + s, y + s);
  g.addColorStop(0, '#a8a29e');
  g.addColorStop(1, '#3f3a36');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#1c1917';
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.beginPath();
  ctx.ellipse(x + s * 0.4, y + s * 0.36, s * 0.1, s * 0.05, -0.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawChannel(ctx, x, y, s, ts) {
  ctx.fillStyle = '#0b4266';
  ctx.fillRect(x, y + s * 0.08, s, s * 0.84);
  ctx.fillStyle = '#5b4636';
  ctx.fillRect(x, y + s * 0.04, s, s * 0.06);
  ctx.fillRect(x, y + s * 0.9, s, s * 0.06);
  ctx.strokeStyle = 'rgba(125,211,252,0.55)';
  ctx.lineWidth = 2;
  for (let k = 0; k < 3; k++) {
    ctx.beginPath();
    for (let i = 0; i <= 10; i++) {
      const px = x + (i / 10) * s;
      const py = y + s * (0.3 + k * 0.2) + Math.sin((x + px) * 0.12 + ts * 0.004 + k) * s * 0.035;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke();
  }
}

function drawSource(ctx, c, x, y, s, ts) {
  ctx.fillStyle = 'rgba(14,165,233,0.2)';
  rr(ctx, x + 3, y + 3, s - 6, s - 6, 8);
  ctx.fill();
  drawPipeBody(ctx, x, y, s, c.dir);
  if (c.segs.a) drawWater(ctx, x, y, s, c.segs.a.paths, c.segs.a.t, ts);
  const cx = x + s / 2, cy = y + s / 2;
  if (G.state === 'build' || G.state === 'intro') {
    const p = (ts % 1200) / 1200;
    ctx.strokeStyle = `rgba(56,189,248,${1 - p})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, s * (0.3 + p * 0.25), 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(cx, cy, s * 0.3, 0, Math.PI * 2);
  ctx.fillStyle = '#0284c7';
  ctx.fill();
  ctx.lineWidth = s * 0.06;
  ctx.strokeStyle = '#7dd3fc';
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = `900 ${Math.round(s * 0.21)}px 'M PLUS Rounded 1c', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('本管', cx, cy + 1);
}

function drawHouse(ctx, c, x, y, s, ts) {
  drawPipeBody(ctx, x, y, s, c.dir);
  if (c.supplied) drawWater(ctx, x, y, s, [[EDGE[c.dir], [0.5, 0.5]]], 1, ts);
  const cx = x + s / 2, cy = y + s * 0.56, w = s * 0.6;
  ctx.fillStyle = c.supplied ? '#fef9c3' : '#e2e8f0';
  rr(ctx, cx - w / 2, cy - w * 0.12, w, w * 0.56, 3);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx - w * 0.64, cy - w * 0.08);
  ctx.lineTo(cx, cy - w * 0.64);
  ctx.lineTo(cx + w * 0.64, cy - w * 0.08);
  ctx.closePath();
  ctx.fillStyle = '#f97316';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = '#7c2d12';
  ctx.stroke();
  ctx.fillStyle = '#7c2d12';
  ctx.fillRect(cx - w * 0.1, cy + w * 0.15, w * 0.2, w * 0.29);
  ctx.fillStyle = c.supplied ? '#facc15' : '#475569';
  ctx.fillRect(cx - w * 0.38, cy + w * 0.02, w * 0.18, w * 0.16);
  ctx.fillRect(cx + w * 0.2, cy + w * 0.02, w * 0.18, w * 0.16);
  if (c.supplied) {
    const bob = Math.sin(ts * 0.006) * 2;
    ctx.beginPath();
    ctx.arc(x + s * 0.82, y + s * 0.2 + bob, s * 0.15, 0, Math.PI * 2);
    ctx.fillStyle = '#22c55e';
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `900 ${Math.round(s * 0.15)}px 'M PLUS Rounded 1c', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('OK', x + s * 0.82, y + s * 0.2 + bob + 1);
  }
}

// 水の行き先がふさがっていないマスを光らせる（ビルド中は黄色、通水中は赤）
function drawHints(ctx, ts) {
  const targets = [];
  if (G.state === 'build' || G.state === 'intro') {
    const s = STAGES[G.stageIdx].source;
    targets.push({ x: s.x + DX[s.dir], y: s.y + DY[s.dir], from: s.dir, warn: false });
  } else if (G.state === 'flow') {
    for (const h of G.heads) {
      const seg = G.grid[h.y][h.x].segs[h.ch];
      for (const d of seg.exits) targets.push({ x: h.x + DX[d], y: h.y + DY[d], from: d, warn: true, t: seg.t });
    }
  } else {
    return;
  }
  const pulse = 0.5 + 0.5 * Math.sin(ts * (G.state === 'flow' ? 0.016 : 0.008));
  for (const t of targets) {
    if (t.x < 0 || t.y < 0 || t.x >= COLS || t.y >= ROWS) continue;
    const n = G.grid[t.y][t.x];
    const ok = (n.type === 'pipe' && (n.mask & OPP[t.from])) || (n.type === 'house' && n.dir === OPP[t.from]);
    if (ok) continue;
    const rgb = t.warn ? '244,63,94' : '250,204,21';
    rr(ctx, t.x * CELL + 3, t.y * CELL + 3, CELL - 6, CELL - 6, 8);
    ctx.fillStyle = `rgba(${rgb},${0.08 + 0.17 * pulse})`;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = `rgba(${rgb},${0.45 + 0.55 * pulse})`;
    ctx.stroke();
    ctx.fillStyle = `rgba(${rgb},${0.7 + 0.3 * pulse})`;
    ctx.font = `900 ${Math.round(CELL * 0.42)}px 'M PLUS Rounded 1c', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t.warn ? '!' : ARROW[t.from], (t.x + 0.5) * CELL, (t.y + 0.5) * CELL);
  }
}

const easeOutBack = k => 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2);

function draw(ts) {
  const ctx = bctx;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, BW, BH);
  ctx.save();
  if (G.shake > 0.3) ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
  ctx.drawImage(bg, 0, 0, BW, BH);
  if (G.grid) {
    for (const row of G.grid) {
      for (const c of row) {
        const x = c.x * CELL, y = c.y * CELL, s = CELL;
        if (c.type === 'rock') drawRock(ctx, x, y, s, c.x, c.y);
        else if (c.type === 'channel') drawChannel(ctx, x, y, s, ts);
      }
    }
    drawHints(ctx, ts);
    for (const row of G.grid) {
      for (const c of row) {
        const x = c.x * CELL, y = c.y * CELL, s = CELL;
        if (c.type === 'source') drawSource(ctx, c, x, y, s, ts);
        else if (c.type === 'house') drawHouse(ctx, c, x, y, s, ts);
        else if (c.type === 'pipe') {
          const k = Math.min(1, (ts - c.placedAt) / 170);
          const sc = k < 1 ? 0.55 + 0.45 * easeOutBack(k) : 1;
          ctx.save();
          if (sc !== 1) {
            ctx.translate(x + s / 2, y + s / 2);
            ctx.scale(sc, sc);
            ctx.translate(-(x + s / 2), -(y + s / 2));
          }
          drawPipeBody(ctx, x, y, s, c.mask);
          for (const ch in c.segs) drawWater(ctx, x, y, s, c.segs[ch].paths, c.segs[ch].t, ts);
          ctx.restore();
        }
      }
    }
  }
  for (const p of G.particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    if (p.sq) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const f of G.floaters) {
    const k = (ts - f.t0) / f.dur;
    if (k < 0 || k > 1) continue;
    ctx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
    ctx.font = `900 ${f.size}px 'M PLUS Rounded 1c', sans-serif`;
    const fx = Math.min(BW - 40, Math.max(40, f.x)), fy = f.y - k * 30;
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.75)';
    ctx.strokeText(f.text, fx, fy);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, fx, fy);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function renderQueue() {
  ['q0', 'q1', 'q2', 'q3'].forEach((id, i) => {
    const cv = $(id);
    const ctx = cv.getContext('2d');
    const size = i === 0 ? 58 : 36;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, size, size);
    ctx.fillStyle = i === 0 ? '#2a1c12' : '#1e293b';
    rr(ctx, 0, 0, size, size, i === 0 ? 12 : 8);
    ctx.fill();
    const m = G.queue[i];
    if (m) drawPipeBody(ctx, 0, 0, size, m);
  });
}

/* ============================================================================
   HUD・ボタン
   ============================================================================ */
function updateHud() {
  const st = STAGES[G.stageIdx];
  $('scoreText').textContent = G.score.toLocaleString();
  const goal = $('goalText');
  goal.textContent = `${G.stats.pipes}/${st.goal}`;
  goal.classList.toggle('done', G.stats.pipes >= st.goal);
  const timer = $('timer');
  timer.classList.toggle('flow', G.state === 'flow' || G.state === 'clearing');
  timer.classList.toggle('warn', G.state === 'build' && G.countdown <= 5);
  if (G.state === 'build' || G.state === 'intro') {
    $('timerFill').style.width = `${(G.countdown / st.countdown) * 100}%`;
    $('timerText').textContent = G.state === 'intro' ? '準備中' : `通水まで ${Math.ceil(G.countdown)}秒`;
  } else if (G.state === 'flow') {
    $('timerFill').style.width = '100%';
    $('timerText').textContent = G.fast ? '⏩ 早送り中！' : '💧 通水中！ 水の先回りで管を置け';
  } else if (G.state === 'clearing') {
    $('timerText').textContent = '✨ 全戸給水完了！';
  } else if (G.state === 'leaking') {
    $('timerFill').style.width = '0%';
    $('timerText').textContent = '💥 水漏れ発生！';
  }
}

function syncButtons() {
  const b = $('actionBtn');
  if (G.state === 'build') {
    b.disabled = false;
    b.className = 'btn btn-primary grow';
    b.textContent = '💧 今すぐ通水（早いほどボーナス）';
  } else if (G.state === 'flow') {
    b.disabled = G.fast;
    b.className = 'btn btn-amber grow';
    b.textContent = G.fast ? '⏩ 早送り中…' : '⏩ 早送り';
  } else {
    b.disabled = true;
  }
  $('retryBtn').disabled = !(G.state === 'build' || G.state === 'flow');
}

/* ============================================================================
   画面（オーバーレイ）
   ============================================================================ */
const overlay = $('overlay');

function showOverlay(html) {
  overlay.innerHTML = html;
  overlay.classList.add('show');
}

function hideOverlay() {
  overlay.classList.remove('show');
  overlay.innerHTML = '';
}

function loadBest() {
  try { return Number(localStorage.getItem('mpc_best') || 0); } catch (e) { return 0; }
}

function saveBest(v) {
  try { localStorage.setItem('mpc_best', String(v)); } catch (e) { /* プライベートモード等 */ }
}

function showTitle() {
  G.state = 'title';
  buildStage(0);
  syncButtons();
  const best = loadBest();
  showOverlay(`
    <div class="card">
      <div class="brand">松下工業 presents</div>
      <h1 class="logo"><span>快感！</span><em>配管クラフト</em></h1>
      <p class="lead">水が流れてくる前に、管をつなげ。<br>漏らさず家まで届けたら、プロの仕事。</p>
      <ol class="howto">
        <li><b>マスをタップ</b>すると「次の管」が置ける</li>
        <li>水が来る前なら<b>上から置き直し</b>OK（−50点）</li>
        <li>時間になると<b>本管から水が出る</b>。水の先回りで管をつなげ！</li>
        <li>1滴でも漏れたら失敗。全部の家に届けばクリア</li>
      </ol>
      <button class="btn btn-amber" data-act="start">▶ スタート（全5ステージ）</button>
      ${best ? `<div class="best">あなたのベスト：${best.toLocaleString()}点</div>` : ''}
    </div>`);
}

function showIntro() {
  const st = STAGES[G.stageIdx];
  showOverlay(`
    <div class="card">
      <span class="tag">STAGE ${G.stageIdx + 1} / ${STAGES.length}</span>
      <h2>${st.name}</h2>
      <p>${st.sub}</p>
      <ul class="missions">
        <li><span class="st">★</span>全部の家（${st.houses.length}軒）に水を届ける</li>
        <li><span class="st">★</span>水が通らない「ムダな管」を1本以下に</li>
        <li><span class="st">★</span>管を${st.goal}本以上つないで届ける</li>
      </ul>
      <p style="font-size:12px;color:#8ea0bd">通水まで ${st.countdown}秒。早く流すほどボーナス！</p>
      <button class="btn btn-primary" data-act="go">準備OK！</button>
    </div>`);
}

function finishStage() {
  const st = STAGES[G.stageIdx];
  let waste = 0;
  for (const row of G.grid) for (const c of row) if (c.type === 'pipe' && !Object.keys(c.segs).length) waste++;
  const wastePenalty = waste * 100;
  G.score = Math.max(0, G.score - wastePenalty);
  const okWaste = waste <= 1, okGoal = G.stats.pipes >= st.goal;
  const stars = 1 + (okWaste ? 1 : 0) + (okGoal ? 1 : 0);
  G.results[G.stageIdx] = { score: G.score, stars };
  updateHud();
  const s = G.stats;
  const last = G.stageIdx === STAGES.length - 1;
  showOverlay(`
    <div class="card">
      <span class="tag">STAGE ${G.stageIdx + 1} CLEAR!</span>
      <div class="stars">${'<span class="on">★</span>'.repeat(stars)}${'<span class="off">★</span>'.repeat(3 - stars)}</div>
      <ul class="missions">
        <li class="ok"><span class="st">★</span>全部の家に給水</li>
        <li class="${okWaste ? 'ok' : 'ng'}"><span class="st">★</span>ムダな管 ${waste}本（1本以下）</li>
        <li class="${okGoal ? 'ok' : 'ng'}"><span class="st">★</span>つないだ管 ${s.pipes}本（${st.goal}本以上）</li>
      </ul>
      <div class="bd">
        <div><span>つないだ管 ×${s.pipes}</span><span>+${(s.pipes * 100).toLocaleString()}</span></div>
        <div><span>給水 ×${s.houses}</span><span>+${(s.houses * 1000).toLocaleString()}</span></div>
        ${s.cross ? `<div><span>クロス通水 ×${s.cross}</span><span>+${(s.cross * 400).toLocaleString()}</span></div>` : ''}
        ${s.early ? `<div><span>早出しボーナス</span><span>+${s.early}</span></div>` : ''}
        ${s.replaced ? `<div class="minus"><span>置き直し ×${s.replaced}</span><span>−${s.replaced * 50}</span></div>` : ''}
        ${waste ? `<div class="minus"><span>ムダな管 ×${waste}</span><span>−${wastePenalty}</span></div>` : ''}
        <div class="total"><span>ステージ得点</span><span>${G.score.toLocaleString()}</span></div>
      </div>
      <div class="memo"><b>🔧 松下社長の現場メモ</b><p>${MEMOS[G.stageIdx]}</p></div>
      <div class="row2">
        <button class="btn btn-ghost" data-act="retry">↺ もう一回</button>
        <button class="btn btn-amber" data-act="next">${last ? '🏆 結果を見る' : '次のステージ ▶'}</button>
      </div>
    </div>`);
}

function showFail() {
  const L = G.leak;
  showOverlay(`
    <div class="card fail">
      <div class="big-emoji">💦</div>
      <h2>${L.title}</h2>
      <p>${L.tip}</p>
      <p style="font-size:12px;color:#8ea0bd">ヒント：通水中は、水が次に向かうマスが<b style="color:#fb7185">赤く光る</b>。そこに向きの合う管を置けばセーフ！</p>
      <div class="row2">
        <button class="btn btn-ghost" data-act="title">タイトルへ</button>
        <button class="btn btn-primary" data-act="retry">↺ もう一回</button>
      </div>
    </div>`);
}

function rankTitle(stars) {
  if (stars >= 14) return '松下社長級の名職人';
  if (stars >= 10) return '頼れる職人';
  if (stars >= 6) return '一人前の配管工';
  return '見習い配管工';
}

function showFinal() {
  G.state = 'result';
  syncButtons();
  const total = G.results.reduce((a, r) => a + (r ? r.score : 0), 0);
  const stars = G.results.reduce((a, r) => a + (r ? r.stars : 0), 0);
  const title = rankTitle(stars);
  const best = loadBest();
  const isBest = total > best;
  if (isBest) saveBest(total);
  G.share = { total, title };
  showOverlay(`
    <div class="card">
      <span class="tag">ALL CLEAR!</span>
      <div class="big-emoji" style="margin-top:8px">🏆</div>
      <div class="total-score">${total.toLocaleString()}<small style="font-size:18px">点</small></div>
      <div style="font-size:13px;color:#8ea0bd">★ ${stars} / ${STAGES.length * 3}${isBest ? '　<b style="color:#fde047">ベスト更新！</b>' : `　ベスト ${best.toLocaleString()}点`}</div>
      <div class="rank-title">称号：${title}</div>
      <div class="share-label">結果をシェア</div>
      <div class="row2">
        <button class="btn btn-x" data-act="share-x">𝕏 でポスト</button>
        <button class="btn btn-line" data-act="share-line">LINEで送る</button>
      </div>
      <div class="recruit">
        <b>🔧 この仕事、本物は松下工業で。</b>
        <p>地面の下や壁の向こうで、街のライフラインを守るのが配管工。未経験から一生モノの技術を身につけませんか？</p>
        ${RECRUIT_URL ? `<a class="btn btn-amber" style="display:block;text-decoration:none" href="${RECRUIT_URL}" target="_blank" rel="noopener">求人を見る ▶</a>` : ''}
      </div>
      <button class="btn btn-primary" data-act="title">もう一度あそぶ</button>
    </div>`);
}

function shareText() {
  const { total, title } = G.share;
  return `快感！配管クラフトで${total.toLocaleString()}点！称号は「${title}」でした💧 #配管クラフト #松下工業`;
}

overlay.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  ac();
  const act = btn.dataset.act;
  if (act === 'start') {
    G.results = [];
    startStage(0, false);
  } else if (act === 'go') {
    hideOverlay();
    G.state = 'build';
    syncButtons();
    updateHud();
  } else if (act === 'retry') {
    startStage(G.stageIdx, true);
  } else if (act === 'next') {
    if (G.stageIdx < STAGES.length - 1) startStage(G.stageIdx + 1, false);
    else showFinal();
  } else if (act === 'title') {
    showTitle();
  } else if (act === 'share-x') {
    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(SITE_URL)}`, '_blank', 'noopener');
  } else if (act === 'share-line') {
    window.open(`https://line.me/R/share?text=${encodeURIComponent(shareText() + '\n' + SITE_URL)}`, '_blank', 'noopener');
  }
});

board.addEventListener('pointerdown', e => {
  ac();
  const r = board.getBoundingClientRect();
  const x = Math.floor(((e.clientX - r.left) / r.width) * COLS);
  const y = Math.floor(((e.clientY - r.top) / r.height) * ROWS);
  if (x >= 0 && y >= 0 && x < COLS && y < ROWS) placeAt(x, y);
});

$('actionBtn').addEventListener('click', () => {
  ac();
  if (G.state === 'build') startFlow(true);
  else if (G.state === 'flow' && !G.fast) {
    G.fast = true;
    syncButtons();
    updateHud();
  }
});

$('retryBtn').addEventListener('click', () => {
  if (G.state === 'build' || G.state === 'flow') startStage(G.stageIdx, true);
});

$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) SFX.place();
});

/* ============================================================================
   メインループ
   ============================================================================ */
let lastTs = performance.now();

function update(dt) {
  if (G.state === 'build') {
    G.countdown -= dt / 1000;
    const sec = Math.ceil(G.countdown);
    if (sec <= 3 && sec >= 1 && sec !== G.lastBeep) {
      G.lastBeep = sec;
      SFX.beep();
    }
    if (G.countdown <= 0) startFlow(false);
    updateHud();
  } else if (G.state === 'flow') {
    stepFlow(dt);
    if (G.state !== 'flow') updateHud();
  } else if (G.state === 'leaking') {
    if (G.now - G.doneAt < 1200) sprayLeak();
    else if (!overlay.classList.contains('show')) {
      updateHud();
      showFail();
    }
  } else if (G.state === 'clearing') {
    if (G.now - G.doneAt > 1300 && !overlay.classList.contains('show')) finishStage();
  }

  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.g;
    if (p.rot !== undefined) p.rot += p.vr;
    p.life -= p.decay;
    if (p.life <= 0) G.particles.splice(i, 1);
  }
  G.floaters = G.floaters.filter(f => G.now - f.t0 < f.dur);
  G.shake *= 0.88;
}

function frame(ts) {
  const dt = Math.min(50, ts - lastTs);
  lastTs = ts;
  G.now = ts;
  update(dt);
  draw(ts);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', layout);
layout();
showTitle();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderQueue);
requestAnimationFrame(frame);
</script>
